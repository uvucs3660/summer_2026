title: "CS 3660 001 | 2026 Summer - Advanced Web Development"
course_code: "CS 3660 001 | 2026 Summer"
start_at: "2026-05-05T00:00:00"
end_at: "2026-08-07T23:59:59"
front_page: syllabus
grading_scheme: letter

# Cheat sheets are glob-loaded from this directory. Each *.md becomes a
# wiki page with slug `cheatsheet-<basename>` and a "Cheat Sheet Library"
# module is auto-emitted listing all of them. SVG references in the
# markdown (e.g. `diagrams/foo.svg`) are inlined into the rendered HTML —
# no web_resources step needed.
cheatsheets_dir: cheatsheets

# Lectures are glob-loaded from this directory. Each *.md must have YAML
# frontmatter declaring week / youtube_id / companion_sheets / reflection_assignment
# / vernacular_tags. The loader auto-prepends a metadata banner (cheat sheet
# links, reflection link, vernacular tags, video embed) and emits a
# "Lecture Spine" module sorted by week.
lectures_dir: lectures

# Quizzes are glob-loaded from this directory. Each *.yaml is one quiz
# (Canvas QTI 1.2 + assessment_meta.xml). Auto-paired remediation
# assignment per quiz: due 48h after the quiz, LLM-graded, 50% point
# recovery for explanations that show real understanding of missed
# concepts. The C-3 workflow.
quizzes_dir: quizzes

late_policy:
  daily_deduction_percent: 10
  floor_percent: 50

assignment_groups:
  - slug: onboarding
    title: Onboarding (Week 1)
    weight: 5
  - slug: lectures
    title: Lecture Engagement (Reflections + Attendance)
    weight: 15
  - slug: sprints
    title: Team Sprints
    weight: 50
  - slug: cc-artifacts
    title: Individual Claude Code Artifacts
    weight: 30

rubrics:
