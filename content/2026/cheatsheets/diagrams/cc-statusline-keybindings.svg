<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .term   { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 10; ry: 10; }
    .script { fill: #14532d; stroke: #34d399; stroke-width: 1.5; rx: 10; ry: 10; }
    .keys   { fill: #581c87; stroke: #c084fc; stroke-width: 1.5; rx: 10; ry: 10; }
    .status { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .label  { fill: #f9fafb; font-weight: 700; font-size: 14px; }
    .body   { fill: #d1d5db; font-size: 12px; }
    .h      { fill: #fcd34d; font-weight: 700; }
    .mute   { fill: #9ca3af; }
    .arrow  { stroke: #fcd34d; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
    .mono   { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">Status line — a script you control, pinned to the bottom of the TUI</text>

  <!-- Mock terminal -->
  <rect class="term" x="20" y="50" width="470" height="300" />
  <text x="38" y="74" class="label">Claude Code (terminal)</text>
  <circle cx="466" cy="69" r="5" fill="#0b1220" stroke="#60a5fa" />

  <!-- scrolling conversation area -->
  <rect x="40" y="88" width="430" height="200" fill="#0b1220" stroke="#60a5fa" rx="6" />
  <text x="54" y="112" class="body mono">&gt; implement the loader</text>
  <text x="54" y="134" class="mute mono">  reading course_loader.dart …</text>
  <text x="54" y="156" class="mute mono">  editing course_loader.dart …</text>
  <text x="54" y="178" class="mute mono">  running dart test …</text>
  <text x="54" y="200" class="body mono">  all tests passed</text>
  <text x="54" y="234" class="mute" font-size="11">(conversation scrolls — this region moves)</text>

  <!-- pinned status line -->
  <rect class="status" x="40" y="300" width="430" height="34" />
  <text x="54" y="321" class="body mono" font-size="11.5">course_builder · main · Opus 4.8 · 18k ctx · $0.42</text>
  <text x="255" y="349" text-anchor="middle" class="mute" font-size="11">pinned — never scrolls away</text>

  <!-- The statusLine script that feeds it -->
  <rect class="script" x="20" y="372" width="470" height="80" />
  <text x="38" y="394" class="label">statusLine script  (Observer)</text>
  <text x="38" y="414" class="body mono" font-size="11">read JSON on stdin → print one line to stdout</text>
  <text x="38" y="434" class="body" font-size="11">settings.json: <tspan class="mono h">"statusLine": { "command": "…" }</tspan></text>

  <!-- arrow: JSON in -->
  <path d="M 255 372 L 255 336" class="arrow" />
  <text x="265" y="362" class="h mono" font-size="11">session JSON (cwd · model · cost)</text>

  <!-- arrow: stdout line up into the status bar -->
  <path d="M 150 372 L 150 336" class="arrow" />
  <text x="60" y="365" class="mute" font-size="10">stdout</text>

  <!-- Keybindings panel -->
  <rect class="keys" x="510" y="50" width="230" height="402" />
  <text x="625" y="74" text-anchor="middle" class="label">Keybindings (Command map)</text>

  <rect x="528" y="92" width="194" height="74" fill="#0b1220" stroke="#c084fc" rx="6" />
  <text x="540" y="114" class="h mono">Shift+Tab</text>
  <text x="540" y="132" class="body">cycle permission modes:</text>
  <text x="540" y="150" class="mute">normal → auto-accept → plan</text>

  <rect x="528" y="178" width="194" height="74" fill="#0b1220" stroke="#c084fc" rx="6" />
  <text x="540" y="200" class="h mono">Esc Esc</text>
  <text x="540" y="218" class="body">rewind the conversation</text>
  <text x="540" y="236" class="mute">jump back to a prior turn</text>

  <rect x="528" y="264" width="194" height="74" fill="#0b1220" stroke="#c084fc" rx="6" />
  <text x="540" y="286" class="h mono">Ctrl+C</text>
  <text x="540" y="304" class="body">interrupt the current</text>
  <text x="540" y="322" class="mute">operation — stop it now</text>

  <rect x="528" y="350" width="194" height="74" fill="#0b1220" stroke="#c084fc" rx="6" />
  <text x="540" y="372" class="h mono">Up arrow</text>
  <text x="540" y="390" class="body">recall previous input</text>
  <text x="540" y="408" class="mute">tweak &amp; resend, don't retype</text>

  <text x="625" y="444" text-anchor="middle" class="mute" font-size="10">ergonomics only — no capability change</text>
</svg>
