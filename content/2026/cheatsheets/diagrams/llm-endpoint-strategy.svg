<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .iface { fill: #581c87; stroke: #c084fc; stroke-width: 1.5; rx: 8; ry: 8; }
    .impl  { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 6; ry: 6; }
    .caller { fill: #14532d; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 14px; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .mute  { fill: #9ca3af; }
    .arrow { stroke: #fcd34d; stroke-width: 1.6; fill: none; }
    .impl-arrow { stroke: #c084fc; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
    <marker id="ali" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c084fc" />
    </marker>
  </defs>

  <text x="20" y="28" class="h" font-size="15">LLM Backends — the Strategy pattern</text>
  <text x="20" y="48" class="mute">One interface; three concrete implementations; config picks at runtime.</text>

  <!-- Caller -->
  <rect class="caller" x="20" y="80" width="200" height="64" />
  <text x="120" y="108" text-anchor="middle" class="label">Your code</text>
  <text x="120" y="128" text-anchor="middle" class="body">backend.chat(messages)</text>

  <!-- Arrow caller → interface -->
  <path class="arrow" d="M 220 112 L 295 112" marker-end="url(#al)" />

  <!-- Interface -->
  <rect class="iface" x="295" y="78" width="180" height="68" />
  <text x="385" y="104" text-anchor="middle" class="label">«interface»</text>
  <text x="385" y="124" text-anchor="middle" class="label">LlmBackend</text>
  <text x="385" y="140" text-anchor="middle" class="body">+ chat(msgs): string</text>

  <!-- Three impls -->
  <rect class="impl" x="20" y="220" width="200" height="68" />
  <text x="120" y="246" text-anchor="middle" class="label">ClassEndpoint</text>
  <text x="120" y="264" text-anchor="middle" class="body">llm.uvucs.org</text>
  <text x="120" y="280" text-anchor="middle" class="mute" font-size="11">default backend</text>

  <rect class="impl" x="280" y="220" width="200" height="68" />
  <text x="380" y="246" text-anchor="middle" class="label">ClaudeApi</text>
  <text x="380" y="264" text-anchor="middle" class="body">api.anthropic.com</text>
  <text x="380" y="280" text-anchor="middle" class="mute" font-size="11">fallback / quality</text>

  <rect class="impl" x="540" y="220" width="200" height="68" />
  <text x="640" y="246" text-anchor="middle" class="label">LocalOllama</text>
  <text x="640" y="264" text-anchor="middle" class="body">localhost:11434</text>
  <text x="640" y="280" text-anchor="middle" class="mute" font-size="11">offline / dev</text>

  <!-- Inheritance arrows from impls to interface -->
  <path class="impl-arrow" d="M 120 220 L 350 146" marker-end="url(#ali)" />
  <path class="impl-arrow" d="M 380 220 L 385 146" marker-end="url(#ali)" />
  <path class="impl-arrow" d="M 640 220 L 425 146" marker-end="url(#ali)" />

  <!-- Footer -->
  <text x="20" y="328" class="mute">Config flips backend; caller code never changes. The Strategy pattern (GoF) earns rubric points by name.</text>
</svg>
