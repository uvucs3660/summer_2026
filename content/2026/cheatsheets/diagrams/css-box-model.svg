<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .l    { fill: #f9fafb; font-weight: 600; }
    .mute { fill: #9ca3af; }
  </style>

  <!-- margin -->
  <rect x="20"  y="20"  width="520" height="320" fill="#7c2d12" stroke="#fb923c" />
  <text class="l" x="40" y="44">margin</text>

  <!-- border -->
  <rect x="80"  y="80"  width="400" height="200" fill="#365314" stroke="#a3e635" />
  <text class="l" x="100" y="104">border</text>

  <!-- padding -->
  <rect x="130" y="130" width="300" height="100" fill="#1e3a8a" stroke="#60a5fa" />
  <text class="l" x="150" y="154">padding</text>

  <!-- content -->
  <rect x="190" y="170" width="180" height="40" fill="#374151" stroke="#9ca3af" />
  <text class="l" x="280" y="195" text-anchor="middle">content</text>

  <!-- label -->
  <text class="mute" x="280" y="320" text-anchor="middle">box-sizing: border-box → width includes padding + border (recommended)</text>
</svg>
