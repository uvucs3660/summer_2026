<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .grid { fill: #0b1220; stroke: #374151; }
    .cell { fill: #1f2937; stroke: #4b5563; }
    .area { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 4; }
    .span { fill: #065f46; stroke: #34d399; stroke-width: 1.5; rx: 4; }
    .l    { fill: #f9fafb; font-weight: 600; }
    .h    { fill: #fcd34d; font-weight: 600; }
    .mute { fill: #9ca3af; }
    .lab  { fill: #fcd34d; font-family: ui-monospace, Menlo, monospace; }
  </style>

  <text class="h" x="40" y="32">grid-template-columns: 1fr 1fr 1fr;  grid-template-rows: auto auto;</text>

  <!-- 3x2 grid -->
  <rect class="grid" x="40" y="50" width="360" height="240" />
  <!-- column lines -->
  <line x1="160" y1="50" x2="160" y2="290" stroke="#374151" />
  <line x1="280" y1="50" x2="280" y2="290" stroke="#374151" />
  <!-- row line -->
  <line x1="40"  y1="170" x2="400" y2="170" stroke="#374151" />

  <!-- header spans 3 cols -->
  <rect class="span" x="48" y="58" width="344" height="100" />
  <text class="l"   x="220" y="115" text-anchor="middle">header  (grid-column: 1 / -1)</text>

  <!-- three cells -->
  <rect class="area" x="48"  y="178" width="104" height="104" />
  <text class="l" x="100" y="234" text-anchor="middle">main</text>
  <rect class="area" x="168" y="178" width="104" height="104" />
  <text class="l" x="220" y="234" text-anchor="middle">aside</text>
  <rect class="area" x="288" y="178" width="104" height="104" />
  <text class="l" x="340" y="234" text-anchor="middle">footer</text>

  <!-- column line numbers -->
  <text class="lab" x="46"  y="46" text-anchor="middle">1</text>
  <text class="lab" x="160" y="46" text-anchor="middle">2</text>
  <text class="lab" x="280" y="46" text-anchor="middle">3</text>
  <text class="lab" x="396" y="46" text-anchor="middle">4</text>

  <!-- row line numbers -->
  <text class="lab" x="30"  y="60" text-anchor="end">1</text>
  <text class="lab" x="30"  y="174" text-anchor="end">2</text>
  <text class="lab" x="30"  y="290" text-anchor="end">3</text>

  <!-- right-side notes -->
  <rect x="430" y="50" width="270" height="240" fill="#0b1220" stroke="#374151" rx="6" />
  <text class="h"    x="445" y="76">Common props</text>
  <text class="l"    x="445" y="100">display: grid;</text>
  <text class="l"    x="445" y="122">grid-template-columns: 200px 1fr;</text>
  <text class="l"    x="445" y="144">grid-template-rows: auto 1fr auto;</text>
  <text class="l"    x="445" y="166">gap: 1rem;</text>
  <text class="l"    x="445" y="194">grid-column: 1 / 3;   /* span 2 */</text>
  <text class="l"    x="445" y="216">grid-row: 2 / span 2;</text>
  <text class="mute" x="445" y="252">"fr" = fractional unit, splits</text>
  <text class="mute" x="445" y="270">leftover space proportionally.</text>
</svg>
