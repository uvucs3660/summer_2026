<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>
  <style>
    .box  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.5; rx: 8; }
    .gbox { fill: #1f2937; stroke: #fcd34d; stroke-width: 1.5; rx: 8; }
    .out  { fill: #1f2937; stroke: #34d399; stroke-width: 1.5; rx: 8; }
    .l    { fill: #f9fafb; font-weight: 600; }
    .mute { fill: #9ca3af; }
    .code { font-family: ui-monospace, Menlo, monospace; fill: #fcd34d; }
    .h    { fill: #fcd34d; font-weight: 600; }
    .edge { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
  </style>

  <text class="h" x="380" y="30" text-anchor="middle">Generics: type variables that flow through a function</text>

  <!-- Input -->
  <rect class="box" x="40" y="80" width="180" height="80" />
  <text class="l"   x="130" y="112" text-anchor="middle">input: T</text>
  <text class="mute" x="130" y="134" text-anchor="middle">T inferred at call site</text>

  <!-- Function -->
  <rect class="gbox" x="280" y="60" width="220" height="120" />
  <text class="l"    x="390" y="92" text-anchor="middle">first&lt;T&gt;(arr: T[]): T</text>
  <text class="code" x="390" y="120" text-anchor="middle">return arr[0];</text>
  <text class="mute" x="390" y="156" text-anchor="middle">T preserved end-to-end</text>

  <!-- Output -->
  <rect class="out" x="560" y="80" width="180" height="80" />
  <text class="l"   x="650" y="112" text-anchor="middle">return: T</text>
  <text class="mute" x="650" y="134" text-anchor="middle">no any, no cast</text>

  <line class="edge" x1="220" y1="120" x2="280" y2="120" marker-end="url(#a)" />
  <line class="edge" x1="500" y1="120" x2="560" y2="120" marker-end="url(#a)" />

  <!-- examples -->
  <rect x="40" y="210" width="700" height="80" fill="#0b1220" stroke="#374151" rx="6" />
  <text class="code" x="55" y="236">first([1, 2, 3])         // T = number  → number</text>
  <text class="code" x="55" y="258">first(["a", "b"])         // T = string  → string</text>
  <text class="code" x="55" y="280">first&lt;User&gt;(loadUsers())   // explicit type argument</text>
</svg>
