<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .state { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 28; ry: 28; }
    .state-bad { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 28; ry: 28; }
    .state-init { fill: #14532d; stroke: #34d399; stroke-width: 1.5; rx: 28; ry: 28; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 13px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .mute  { fill: #9ca3af; }
    .arrow { stroke: #fcd34d; stroke-width: 1.6; fill: none; }
    .evt   { fill: #fcd34d; font-size: 11px; font-weight: 600; }
  </style>
  <defs>
    <marker id="sc1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">Job Pack — résumé generator state chart</text>
  <text x="20" y="46" class="mute">Five named states · explicit transitions · impossible-state bugs prevented at design time.</text>

  <!-- Initial pseudo-state (small filled circle) -->
  <circle cx="60" cy="120" r="6" fill="#fcd34d" stroke="#fcd34d" />
  <path class="arrow" d="M 66 120 L 100 120" marker-end="url(#sc1)" />

  <!-- idle -->
  <rect class="state-init" x="100" y="100" width="120" height="44" />
  <text x="160" y="124" text-anchor="middle" class="label">idle</text>
  <text x="160" y="138" text-anchor="middle" class="body">no inputs yet</text>

  <!-- ready -->
  <rect class="state" x="280" y="100" width="120" height="44" />
  <text x="340" y="124" text-anchor="middle" class="label">ready</text>
  <text x="340" y="138" text-anchor="middle" class="body">inputs pasted</text>

  <!-- generating -->
  <rect class="state" x="460" y="100" width="120" height="44" />
  <text x="520" y="124" text-anchor="middle" class="label">generating</text>
  <text x="520" y="138" text-anchor="middle" class="body">LLM call in flight</text>

  <!-- reviewing -->
  <rect class="state" x="280" y="230" width="120" height="44" />
  <text x="340" y="254" text-anchor="middle" class="label">reviewing</text>
  <text x="340" y="268" text-anchor="middle" class="body">draft ready</text>

  <!-- editing -->
  <rect class="state" x="460" y="230" width="120" height="44" />
  <text x="520" y="254" text-anchor="middle" class="label">editing</text>
  <text x="520" y="268" text-anchor="middle" class="body">user edits</text>

  <!-- errored -->
  <rect class="state-bad" x="640" y="100" width="100" height="44" />
  <text x="690" y="124" text-anchor="middle" class="label">errored</text>
  <text x="690" y="138" text-anchor="middle" class="body">retry-able</text>

  <!-- Transitions -->
  <!-- idle -> ready -->
  <path class="arrow" d="M 220 122 L 278 122" marker-end="url(#sc1)" />
  <text x="245" y="115" text-anchor="middle" class="evt">PASTE_INPUTS</text>

  <!-- ready -> generating -->
  <path class="arrow" d="M 400 122 L 458 122" marker-end="url(#sc1)" />
  <text x="429" y="115" text-anchor="middle" class="evt">GENERATE</text>

  <!-- generating -> reviewing -->
  <path class="arrow" d="M 480 144 L 380 230" marker-end="url(#sc1)" />
  <text x="436" y="186" text-anchor="middle" class="evt">SUCCESS</text>

  <!-- generating -> errored -->
  <path class="arrow" d="M 580 122 L 638 122" marker-end="url(#sc1)" />
  <text x="609" y="115" text-anchor="middle" class="evt">FAILURE</text>

  <!-- reviewing -> editing -->
  <path class="arrow" d="M 400 252 L 458 252" marker-end="url(#sc1)" />
  <text x="429" y="245" text-anchor="middle" class="evt">EDIT</text>

  <!-- reviewing -> generating (retry/regenerate) -->
  <path class="arrow" d="M 360 230 L 480 144" marker-end="url(#sc1)" />
  <text x="430" y="200" text-anchor="middle" class="evt">GENERATE</text>

  <!-- editing -> generating -->
  <path class="arrow" d="M 540 230 L 540 144" marker-end="url(#sc1)" />
  <text x="572" y="190" class="evt">GENERATE</text>

  <!-- errored -> generating (retry) -->
  <path class="arrow" d="M 690 144 L 580 144" marker-end="url(#sc1)" />
  <text x="635" y="156" class="evt">GENERATE</text>

  <!-- RESET back to idle (curved) -->
  <path class="arrow" d="M 280 250 Q 100 280 130 144" marker-end="url(#sc1)" />
  <text x="80" y="265" class="evt">RESET</text>

  <!-- Footnote -->
  <text x="20" y="350" class="h">Why this beats boolean flags:</text>
  <text x="20" y="370" class="body">• Five states named · listed once · enumerable for tests</text>
  <text x="20" y="386" class="body">• Impossible transitions don't exist (you can't GENERATE from idle — there's no edge)</text>
  <text x="20" y="402" class="body">• Add a state? One node + edges. Don't touch the existing if/flag tangle.</text>
  <text x="20" y="418" class="body">• Visual = same artifact you'd whiteboard with a teammate, executable as code</text>
  <text x="20" y="436" class="body">• Async work (LLM call) lives ON the state — cancellation, retries, lifecycle are declarative</text>
</svg>
