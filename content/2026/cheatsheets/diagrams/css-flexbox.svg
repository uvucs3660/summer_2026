<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>
  <style>
    .container { fill: #111827; stroke: #fcd34d; stroke-width: 1.5; rx: 8; ry: 8; stroke-dasharray: 4 3; }
    .item { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 6; ry: 6; }
    .l { fill: #f9fafb; }
    .axis { stroke: #fcd34d; stroke-width: 2; fill: none; }
    .h { fill: #fcd34d; font-weight: 600; }
    .mute { fill: #9ca3af; }
  </style>

  <!-- Row container (default) -->
  <text class="h" x="40"  y="30">flex-direction: row (default)</text>
  <rect class="container" x="40" y="50" width="320" height="100" />
  <rect class="item" x="60"  y="80" width="60" height="40" /><text class="l" x="90"  y="105" text-anchor="middle">A</text>
  <rect class="item" x="130" y="80" width="60" height="40" /><text class="l" x="160" y="105" text-anchor="middle">B</text>
  <rect class="item" x="200" y="80" width="60" height="40" /><text class="l" x="230" y="105" text-anchor="middle">C</text>
  <line class="axis" x1="60" y1="160" x2="345" y2="160" marker-end="url(#arr)" />
  <text class="mute" x="200" y="178" text-anchor="middle">main axis →  justify-content</text>
  <line class="axis" x1="370" y1="55" x2="370" y2="145" marker-end="url(#arr)" />
  <text class="mute" x="395" y="105">cross axis ↓ align-items</text>

  <!-- Column container -->
  <text class="h" x="500" y="30">flex-direction: column</text>
  <rect class="container" x="500" y="50" width="200" height="200" />
  <rect class="item" x="540" y="70"  width="120" height="32" /><text class="l" x="600" y="91"  text-anchor="middle">A</text>
  <rect class="item" x="540" y="112" width="120" height="32" /><text class="l" x="600" y="133" text-anchor="middle">B</text>
  <rect class="item" x="540" y="154" width="120" height="32" /><text class="l" x="600" y="175" text-anchor="middle">C</text>
  <line class="axis" x1="710" y1="60" x2="710" y2="245" marker-end="url(#arr)" />
  <text class="mute" x="730" y="155" transform="rotate(90 730 155)">main axis</text>

  <!-- Common props -->
  <text class="h" x="40" y="220">Common props</text>
  <rect x="40" y="235" width="420" height="105" fill="#0b1220" stroke="#374151" rx="6" />
  <text class="l" x="55" y="258">display: flex;</text>
  <text class="l" x="55" y="278">justify-content: flex-start | center | space-between;</text>
  <text class="l" x="55" y="298">align-items: stretch | center | flex-start | flex-end;</text>
  <text class="l" x="55" y="318">gap: 1rem;   flex: 1;   flex-wrap: wrap;</text>
</svg>
