<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">
  <style>
    .node { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.5; rx: 6; ry: 6; }
    .leaf { fill: #1f2937; stroke: #34d399; stroke-width: 1.5; rx: 6; ry: 6; }
    .label { fill: #f9fafb; }
    .edge { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .tag { fill: #fcd34d; font-weight: 600; }
  </style>

  <!-- root -->
  <rect class="node" x="310" y="20" width="100" height="36" />
  <text class="label tag" x="360" y="43" text-anchor="middle">&lt;html&gt;</text>

  <!-- head + body -->
  <line class="edge" x1="360" y1="56" x2="190" y2="100" />
  <line class="edge" x1="360" y1="56" x2="530" y2="100" />
  <rect class="node" x="140" y="100" width="100" height="36" />
  <text class="label tag" x="190" y="123" text-anchor="middle">&lt;head&gt;</text>
  <rect class="node" x="480" y="100" width="100" height="36" />
  <text class="label tag" x="530" y="123" text-anchor="middle">&lt;body&gt;</text>

  <!-- head children -->
  <line class="edge" x1="190" y1="136" x2="80"  y2="190" />
  <line class="edge" x1="190" y1="136" x2="190" y2="190" />
  <line class="edge" x1="190" y1="136" x2="300" y2="190" />
  <rect class="leaf" x="30"  y="190" width="100" height="32" />
  <text class="label tag" x="80"  y="211" text-anchor="middle">&lt;title&gt;</text>
  <rect class="leaf" x="140" y="190" width="100" height="32" />
  <text class="label tag" x="190" y="211" text-anchor="middle">&lt;meta&gt;</text>
  <rect class="leaf" x="250" y="190" width="100" height="32" />
  <text class="label tag" x="300" y="211" text-anchor="middle">&lt;link&gt;</text>

  <!-- body children -->
  <line class="edge" x1="530" y1="136" x2="430" y2="190" />
  <line class="edge" x1="530" y1="136" x2="530" y2="190" />
  <line class="edge" x1="530" y1="136" x2="640" y2="190" />
  <rect class="leaf" x="380" y="190" width="100" height="32" />
  <text class="label tag" x="430" y="211" text-anchor="middle">&lt;header&gt;</text>
  <rect class="leaf" x="480" y="190" width="100" height="32" />
  <text class="label tag" x="530" y="211" text-anchor="middle">&lt;main&gt;</text>
  <rect class="leaf" x="590" y="190" width="100" height="32" />
  <text class="label tag" x="640" y="211" text-anchor="middle">&lt;footer&gt;</text>

  <!-- main children -->
  <line class="edge" x1="530" y1="222" x2="450" y2="270" />
  <line class="edge" x1="530" y1="222" x2="530" y2="270" />
  <line class="edge" x1="530" y1="222" x2="610" y2="270" />
  <rect class="leaf" x="400" y="270" width="100" height="32" />
  <text class="label tag" x="450" y="291" text-anchor="middle">&lt;section&gt;</text>
  <rect class="leaf" x="480" y="270" width="100" height="32" />
  <text class="label tag" x="530" y="291" text-anchor="middle">&lt;article&gt;</text>
  <rect class="leaf" x="560" y="270" width="100" height="32" />
  <text class="label tag" x="610" y="291" text-anchor="middle">&lt;aside&gt;</text>

  <text x="360" y="340" text-anchor="middle" fill="#9ca3af">DOM tree: every page is just nested elements rooted at &lt;html&gt;</text>
</svg>
