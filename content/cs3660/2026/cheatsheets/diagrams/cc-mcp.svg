<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .host   { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 10; ry: 10; }
    .proto  { fill: #14532d; stroke: #34d399; stroke-width: 1.5; rx: 10; ry: 10; }
    .server { fill: #581c87; stroke: #c084fc; stroke-width: 1.5; rx: 10; ry: 10; }
    .ext    { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 10; ry: 10; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 14px; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .mute  { fill: #9ca3af; }
    .arrow { stroke: #fcd34d; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">MCP — Claude Code (host) speaks one protocol to many servers</text>

  <!-- Host: Claude Code -->
  <rect class="host" x="20" y="60" width="190" height="170" />
  <text x="115" y="84" text-anchor="middle" class="label">Claude Code</text>
  <text x="115" y="102" text-anchor="middle" class="body">MCP host / client</text>

  <rect x="38" y="120" width="154" height="32" fill="#0b1220" stroke="#60a5fa" rx="6" />
  <text x="115" y="140" text-anchor="middle" class="body">calls tools</text>

  <rect x="38" y="160" width="154" height="32" fill="#0b1220" stroke="#60a5fa" rx="6" />
  <text x="115" y="180" text-anchor="middle" class="body">reads resources</text>

  <text x="115" y="214" text-anchor="middle" class="mute">/mcp lists servers</text>

  <!-- Protocol adapter in the middle -->
  <rect class="proto" x="280" y="70" width="150" height="150" />
  <text x="355" y="94" text-anchor="middle" class="label">MCP Protocol</text>
  <text x="355" y="112" text-anchor="middle" class="body">uniform interface</text>
  <text x="355" y="128" text-anchor="middle" class="body">(adapter)</text>

  <text x="355" y="158" text-anchor="middle" class="h">transports</text>
  <text x="355" y="176" text-anchor="middle" class="body">stdio (local)</text>
  <text x="355" y="192" text-anchor="middle" class="body">SSE</text>
  <text x="355" y="208" text-anchor="middle" class="body">HTTP</text>

  <!-- host <-> protocol -->
  <path d="M 210 130 L 280 130" class="arrow" />
  <path d="M 280 165 L 210 165" class="arrow" />

  <!-- Servers (right column) -->
  <rect class="server" x="500" y="60" width="115" height="62" />
  <text x="557" y="82" text-anchor="middle" class="label">github</text>
  <text x="557" y="100" text-anchor="middle" class="body">issues, PRs</text>
  <text x="557" y="114" text-anchor="middle" class="mute">tools</text>

  <rect class="server" x="500" y="134" width="115" height="62" />
  <text x="557" y="156" text-anchor="middle" class="label">postgres</text>
  <text x="557" y="174" text-anchor="middle" class="body">query DB</text>
  <text x="557" y="188" text-anchor="middle" class="mute">tools + resources</text>

  <rect class="server" x="500" y="208" width="115" height="62" />
  <text x="557" y="230" text-anchor="middle" class="label">playwright</text>
  <text x="557" y="248" text-anchor="middle" class="body">drive browser</text>
  <text x="557" y="262" text-anchor="middle" class="mute">tools</text>

  <rect class="server" x="500" y="282" width="115" height="62" />
  <text x="557" y="304" text-anchor="middle" class="label">context7</text>
  <text x="557" y="322" text-anchor="middle" class="body">live docs</text>
  <text x="557" y="336" text-anchor="middle" class="mute">resources</text>

  <rect class="server" x="500" y="356" width="115" height="62" />
  <text x="557" y="378" text-anchor="middle" class="label">filesystem</text>
  <text x="557" y="396" text-anchor="middle" class="body">scoped files</text>
  <text x="557" y="410" text-anchor="middle" class="mute">tools + resources</text>

  <!-- protocol -> each server -->
  <path d="M 430 110 L 500 91" class="arrow" />
  <path d="M 430 140 L 500 165" class="arrow" />
  <path d="M 430 165 L 500 239" class="arrow" />
  <path d="M 430 185 L 500 313" class="arrow" />
  <path d="M 430 205 L 500 387" class="arrow" />

  <!-- External systems (far right) -->
  <rect class="ext" x="655" y="60" width="90" height="62" />
  <text x="700" y="88" text-anchor="middle" class="body" font-weight="700">GitHub</text>
  <text x="700" y="104" text-anchor="middle" class="mute">repos</text>

  <rect class="ext" x="655" y="134" width="90" height="62" />
  <text x="700" y="162" text-anchor="middle" class="body" font-weight="700">Database</text>
  <text x="700" y="178" text-anchor="middle" class="mute">Postgres</text>

  <rect class="ext" x="655" y="208" width="90" height="62" />
  <text x="700" y="236" text-anchor="middle" class="body" font-weight="700">Browser</text>
  <text x="700" y="252" text-anchor="middle" class="mute">real Chromium</text>

  <rect class="ext" x="655" y="282" width="90" height="62" />
  <text x="700" y="310" text-anchor="middle" class="body" font-weight="700">Docs</text>
  <text x="700" y="326" text-anchor="middle" class="mute">live, current</text>

  <rect class="ext" x="655" y="356" width="90" height="62" />
  <text x="700" y="384" text-anchor="middle" class="body" font-weight="700">Disk</text>
  <text x="700" y="400" text-anchor="middle" class="mute">your files</text>

  <!-- server -> external -->
  <path d="M 615 91 L 655 91" class="arrow" />
  <path d="M 615 165 L 655 165" class="arrow" />
  <path d="M 615 239 L 655 239" class="arrow" />
  <path d="M 615 313 L 655 313" class="arrow" />
  <path d="M 615 387 L 655 387" class="arrow" />

  <!-- Security footer -->
  <rect class="ext" x="20" y="450" width="595" height="50" />
  <text x="32" y="473" class="label">Security</text>
  <text x="32" y="491" class="body">servers run with your privileges · only add servers you trust · scope tokens minimally · <tspan class="h">${ENV_VAR}</tspan>, never a literal token</text>
</svg>
