<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>
  <style>
    .box  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.5; rx: 8; ry: 8; }
    .form { fill: #1f2937; stroke: #fcd34d; stroke-width: 1.5; rx: 8; ry: 8; }
    .srv  { fill: #1f2937; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .l    { fill: #f9fafb; }
    .mute { fill: #9ca3af; }
    .edge { stroke: #9ca3af; stroke-width: 1.5; fill: none; }
    .code { font-family: ui-monospace, Menlo, monospace; fill: #fcd34d; }
  </style>

  <!-- Form fields -->
  <rect class="form" x="20" y="40" width="220" height="200" />
  <text class="l" x="130" y="62" text-anchor="middle" font-weight="600">&lt;form action="/login" method="POST"&gt;</text>
  <rect x="40"  y="80"  width="180" height="28" fill="#111827" stroke="#4b5563"/>
  <text class="mute" x="50" y="99">name="email"</text>
  <rect x="40"  y="118" width="180" height="28" fill="#111827" stroke="#4b5563"/>
  <text class="mute" x="50" y="137">name="password"</text>
  <rect x="40"  y="160" width="100" height="32" fill="#374151" stroke="#9ca3af"/>
  <text class="l" x="90" y="181" text-anchor="middle">submit</text>

  <!-- arrow + payload -->
  <line class="edge" x1="240" y1="140" x2="370" y2="140" marker-end="url(#arr)" />
  <text class="code" x="305" y="125" text-anchor="middle">POST /login</text>
  <text class="code" x="305" y="160" text-anchor="middle">email=...&amp;password=...</text>

  <!-- Server -->
  <rect class="srv" x="380" y="60" width="180" height="160" />
  <text class="l" x="470" y="90" text-anchor="middle" font-weight="600">Koa server</text>
  <text class="mute" x="470" y="120" text-anchor="middle">koaBody() parses</text>
  <text class="mute" x="470" y="138" text-anchor="middle">ctx.request.body</text>
  <text class="mute" x="470" y="172" text-anchor="middle">router.post('/login',</text>
  <text class="mute" x="470" y="190" text-anchor="middle">handler)</text>

  <!-- arrow back -->
  <line class="edge" x1="560" y1="140" x2="690" y2="140" marker-end="url(#arr)" />
  <text class="code" x="625" y="125" text-anchor="middle">200 OK</text>
  <text class="code" x="625" y="160" text-anchor="middle">{ token: "..." }</text>

  <!-- Response box -->
  <rect class="box" x="700" y="100" width="50" height="80" />
  <text class="l" x="725" y="146" text-anchor="middle">JSON</text>

  <text class="mute" x="380" y="260" text-anchor="middle">Form fields → request body → server handler → JSON response</text>
</svg>
