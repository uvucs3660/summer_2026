<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .layer-mgd { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 10; ry: 10; }
    .layer-usr { fill: #581c87; stroke: #c084fc; stroke-width: 1.5; rx: 10; ry: 10; }
    .layer-prj { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; rx: 10; ry: 10; }
    .layer-sub { fill: #14532d; stroke: #34d399; stroke-width: 1.5; rx: 10; ry: 10; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 14px; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .mute  { fill: #9ca3af; }
    .arrow { stroke: #fcd34d; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">CLAUDE.md — precedence hierarchy, all merged into every session's context</text>
  <text x="20" y="46" class="mute">most general (top) → most specific (bottom); more specific layers override / add to more general</text>

  <!-- Level 1: enterprise / managed -->
  <rect class="layer-mgd" x="40" y="62" width="420" height="62" />
  <text x="56" y="84" class="label">1 · Enterprise / Managed policy</text>
  <text x="56" y="103" class="body">org-managed · every project on the machine · set by admin</text>
  <text x="56" y="118" class="mute">org-controlled, not yours to edit</text>

  <!-- Level 2: user global -->
  <rect class="layer-usr" x="40" y="134" width="420" height="62" />
  <text x="56" y="156" class="label">2 · User global</text>
  <text x="56" y="175" class="body"><tspan class="h">~/.claude/CLAUDE.md</tspan> · all YOUR projects</text>
  <text x="56" y="190" class="mute">personal prefs · not checked into git</text>

  <!-- Level 3: project root -->
  <rect class="layer-prj" x="40" y="206" width="420" height="62" />
  <text x="56" y="228" class="label">3 · Project root</text>
  <text x="56" y="247" class="body"><tspan class="h">CLAUDE.md</tspan> at repo root · shared with the team</text>
  <text x="56" y="262" class="mute">checked into git · the Sprint repo's brief</text>

  <!-- Level 4: subdirectory -->
  <rect class="layer-sub" x="40" y="278" width="420" height="62" />
  <text x="56" y="300" class="label">4 · Subdirectory</text>
  <text x="56" y="319" class="body"><tspan class="h">services/api/CLAUDE.md</tspan> · loaded in that subtree</text>
  <text x="56" y="334" class="mute">layers on when you cd into it · most specific wins</text>

  <!-- precedence arrows down the stack -->
  <path d="M 30 93 L 30 165 L 38 165" class="arrow" />
  <path d="M 30 165 L 30 237 L 38 237" class="arrow" />
  <path d="M 30 237 L 30 309 L 38 309" class="arrow" />

  <!-- merge target on the right -->
  <rect class="layer-prj" x="500" y="134" width="240" height="134" />
  <text x="620" y="158" text-anchor="middle" class="label">Merged session context</text>
  <text x="620" y="180" text-anchor="middle" class="body">all applicable files combined,</text>
  <text x="620" y="196" text-anchor="middle" class="body">always loaded — every turn</text>
  <rect x="520" y="214" width="200" height="40" fill="#0b1220" stroke="#60a5fa" rx="6" />
  <text x="620" y="232" text-anchor="middle" class="body" font-weight="700">costs tokens each turn</text>
  <text x="620" y="246" text-anchor="middle" class="mute">keep it concise</text>

  <!-- arrows from each level into the merge -->
  <path d="M 460 93 C 500 100, 480 150, 500 175" class="arrow" />
  <path d="M 460 165 L 500 185" class="arrow" />
  <path d="M 460 237 C 490 220, 480 215, 500 205" class="arrow" />
  <path d="M 460 309 C 500 300, 480 235, 500 222" class="arrow" />

  <!-- @path imports row -->
  <rect class="layer-sub" x="40" y="370" width="700" height="120" />
  <text x="56" y="392" class="label">@path imports — pull referenced files into any CLAUDE.md</text>

  <rect x="60" y="406" width="200" height="68" fill="#0b1220" stroke="#34d399" rx="6" />
  <text x="160" y="428" text-anchor="middle" class="h">CLAUDE.md</text>
  <text x="160" y="448" text-anchor="middle" class="body">@docs/architecture.md</text>
  <text x="160" y="464" text-anchor="middle" class="body">@~/.claude/defaults.md</text>

  <rect x="540" y="406" width="180" height="68" fill="#0b1220" stroke="#34d399" rx="6" />
  <text x="630" y="430" text-anchor="middle" class="body" font-weight="700">imported file</text>
  <text x="630" y="448" text-anchor="middle" class="mute">loaded inline,</text>
  <text x="630" y="463" text-anchor="middle" class="mute">also costs context</text>

  <path d="M 260 440 L 540 440" class="arrow" />
  <text x="400" y="432" text-anchor="middle" class="mute">@path resolves &amp; inlines</text>

  <!-- bottom note -->
  <text x="20" y="520" class="body"><tspan class="h">/init</tspan> generates a starter CLAUDE.md by analyzing the repo — then you trim it and add do-not-do rules.</text>
  <text x="20" y="542" class="mute">Contrast: CLAUDE.md = facts about the codebase · auto memory/MEMORY.md = facts about you · skills = lazy-loaded workflows.</text>
</svg>
