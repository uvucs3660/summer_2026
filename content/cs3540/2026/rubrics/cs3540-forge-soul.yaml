slug: cs3540-forge-soul
title: "Forge — A Soul Prompt"
criteria:
  - slug: it-works
    description: Deployed via system prompt or subagent body and observably changes behavior.
    ratings:
      - description: Demonstrated working in the student's own repository.
        points: 40
      - description: Present and plausible but not demonstrated.
        points: 20
      - description: Missing or non-functional.
        points: 0
  - slug: fit
    description: Values are ranked, not listed — the ordering resolves a real conflict.
    ratings:
      - description: Solves a real problem the student actually had.
        points: 30
      - description: Generic — works, but any project could use it unchanged.
        points: 16
      - description: Contrived to satisfy the assignment.
        points: 0
  - slug: evidence
    description: A transcript showing the agent behaving differently with and without it.
    ratings:
      - description: Committed with a record of it running, including the output.
        points: 30
      - description: Committed without evidence of a run.
        points: 15
      - description: No evidence.
        points: 0
