slug: cs3540-forge-council
title: "Forge — A Council Run"
criteria:
  - slug: it-works
    description: Three independent perspectives on one real decision, one ruling, and the dissent recorded.
    ratings:
      - description: Demonstrated working in the student's own repository.
        points: 40
      - description: Present and plausible but not demonstrated.
        points: 20
      - description: Missing or non-functional.
        points: 0
  - slug: fit
    description: The decision was genuinely open — the perspectives disagreed about something that mattered.
    ratings:
      - description: Solves a real problem the student actually had.
        points: 30
      - description: Generic — works, but any project could use it unchanged.
        points: 16
      - description: Contrived to satisfy the assignment.
        points: 0
  - slug: evidence
    description: The deliberation, the ruling, and the preserved dissent committed.
    ratings:
      - description: Committed with a record of it running, including the output.
        points: 30
      - description: Committed without evidence of a run.
        points: 15
      - description: No evidence.
        points: 0
