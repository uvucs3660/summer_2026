slug: cs3540-forge-spec-plan
title: "Forge — A Spec and Plan"
criteria:
  - slug: it-works
    description: Each plan step is executable in a single session by an agent with no other context.
    ratings:
      - description: Demonstrated working in the student's own repository.
        points: 40
      - description: Present and plausible but not demonstrated.
        points: 20
      - description: Missing or non-functional.
        points: 0
  - slug: fit
    description: The spec states behavior and acceptance criteria; the plan sequences them into verifiable steps.
    ratings:
      - description: Solves a real problem the student actually had.
        points: 30
      - description: Generic — works, but any project could use it unchanged.
        points: 16
      - description: Contrived to satisfy the assignment.
        points: 0
  - slug: evidence
    description: The spec and plan committed, with at least one step executed and its result recorded.
    ratings:
      - description: Committed with a record of it running, including the output.
        points: 30
      - description: Committed without evidence of a run.
        points: 15
      - description: No evidence.
        points: 0
