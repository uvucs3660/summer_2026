<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.3; rx: 6; ry: 6; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.4; rx: 6; ry: 6; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .line  { stroke: #9ca3af; stroke-width: 1.5; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="390" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">Every genre you know was invented to fit inside a limit</text>

  <line x1="40" y1="72" x2="740" y2="72" class="line" />

  <rect class="node" x="30" y="88" width="130" height="112" />
  <text x="95" y="110" text-anchor="middle" class="label">1978 · sprites</text>
  <text x="95" y="132" text-anchor="middle" class="mute">CPU too slow to move</text>
  <text x="95" y="148" text-anchor="middle" class="mute">all the invaders fast</text>
  <text x="95" y="172" text-anchor="middle" class="body">→ they speed up</text>
  <text x="95" y="190" text-anchor="middle" class="body">as you kill them</text>

  <rect class="node" x="180" y="88" width="130" height="112" />
  <text x="245" y="110" text-anchor="middle" class="label">1980s · tiles</text>
  <text x="245" y="132" text-anchor="middle" class="mute">no memory for a</text>
  <text x="245" y="148" text-anchor="middle" class="mute">whole-screen bitmap</text>
  <text x="245" y="172" text-anchor="middle" class="body">→ the grid, the</text>
  <text x="245" y="190" text-anchor="middle" class="body">platformer, the RPG map</text>

  <rect class="node" x="330" y="88" width="130" height="112" />
  <text x="395" y="110" text-anchor="middle" class="label">1993 · raycast</text>
  <text x="395" y="132" text-anchor="middle" class="mute">no hardware 3D</text>
  <text x="395" y="148" text-anchor="middle" class="mute">at all</text>
  <text x="395" y="172" text-anchor="middle" class="body">→ corridors, right</text>
  <text x="395" y="190" text-anchor="middle" class="body">angles, the FPS</text>

  <rect class="node" x="480" y="88" width="130" height="112" />
  <text x="545" y="110" text-anchor="middle" class="label">1998 · fog</text>
  <text x="545" y="132" text-anchor="middle" class="mute">draw distance too</text>
  <text x="545" y="148" text-anchor="middle" class="mute">short to hide</text>
  <text x="545" y="172" text-anchor="middle" class="body">→ Silent Hill's fog</text>
  <text x="545" y="190" text-anchor="middle" class="body">becomes the horror</text>

  <rect class="good" x="630" y="88" width="130" height="112" />
  <text x="695" y="110" text-anchor="middle" class="label">2026 · yours</text>
  <text x="695" y="132" text-anchor="middle" class="mute">a 3B model, a free</text>
  <text x="695" y="148" text-anchor="middle" class="mute">tier, no server</text>
  <text x="695" y="172" text-anchor="middle" class="body">→ what does that</text>
  <text x="695" y="190" text-anchor="middle" class="body">make possible?</text>

  <rect class="panel" x="20" y="222" width="740" height="150" />
  <text x="36" y="246" class="h">The pattern worth taking from this</text>
  <text x="36" y="272" class="body">In every case the limitation was not worked around — it was made into the identity of the game.</text>
  <text x="36" y="290" class="body">Space Invaders' escalating difficulty is a CPU running out of headroom. Silent Hill's dread is a</text>
  <text x="36" y="308" class="body">draw-distance problem the team chose to lean into rather than hide.</text>
  <text x="36" y="338" class="label">Your constraints this term: a small local model, an unpublished free-tier quota, and no server.</text>
  <text x="36" y="358" class="mute">The interesting question is not how to escape them. It is which game they make possible that a bigger budget would not.</text>
</svg>
