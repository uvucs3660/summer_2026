<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="296" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Why FNV-1a needs Math.imul</text>
  <rect class="panel" x="20" y="42" width="740" height="40" />
  <text x="36" y="68" class="label">A JavaScript number is exact only to 2 ** 53. A 32-bit multiply blows straight past it.</text>
  <rect class="panel" x="20" y="94" width="360" height="154" />
  <text x="36" y="120" class="h" font-size="13">The obvious version</text>
  <text x="36" y="146" class="code">h = (h * 16777619) &gt;&gt;&gt; 0</text>
  <rect class="bad" x="36" y="160" width="328" height="64" />
  <text x="200" y="184" class="label" text-anchor="middle" font-size="11">product needs up to 56 bits</text>
  <text x="200" y="206" class="body" text-anchor="middle" font-size="11">low bits gone before &gt;&gt;&gt; 0 runs</text>
  <text x="36" y="240" class="mute">Wrong, and wrong quietly.</text>
  <rect class="panel" x="400" y="94" width="360" height="154" />
  <text x="416" y="120" class="h" font-size="13">The correct version</text>
  <text x="416" y="146" class="code">h = Math.imul(h, 16777619) &gt;&gt;&gt; 0</text>
  <rect class="good" x="416" y="160" width="328" height="64" />
  <text x="580" y="184" class="label" text-anchor="middle" font-size="11">a true 32-bit multiply</text>
  <text x="580" y="206" class="body" text-anchor="middle" font-size="11">wraps exactly, the way C would</text>
  <text x="416" y="240" class="mute">Bit-identical to the Dart original.</text>
  <rect class="panel" x="20" y="260" width="740" height="28" />
  <text x="36" y="279" class="body" font-size="11">One hash, four jobs: desync detector, replay verifier, conformance oracle, proof a model did not corrupt the sim.</text>
</svg>
