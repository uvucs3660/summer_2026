<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="288" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Canvas 2D has no depth buffer. Sorting is your z-index.</text>
  <rect class="panel" x="20" y="42" width="360" height="176" />
  <text x="36" y="68" class="h" font-size="13">Sort by layer alone</text>
  <rect class="warn" x="36" y="84" width="328" height="40" />
  <text x="200" y="108" class="label" text-anchor="middle" font-size="11">two sprites, same layer</text>
  <path class="warrow" d="M 200 128 L 200 146" />
  <rect class="bad" x="36" y="152" width="328" height="46" />
  <text x="200" y="172" class="body" text-anchor="middle" font-size="11">order depends on iteration order</text>
  <text x="200" y="190" class="body" text-anchor="middle" font-size="11">they swap between frames and flicker</text>
  <rect class="panel" x="400" y="42" width="360" height="176" />
  <text x="416" y="68" class="h" font-size="13">Sort by (layer, id)</text>
  <rect class="node" x="416" y="84" width="328" height="40" />
  <text x="580" y="108" class="label" text-anchor="middle" font-size="11">two sprites, same layer</text>
  <path class="arrow" d="M 580 128 L 580 146" />
  <rect class="good" x="416" y="152" width="328" height="46" />
  <text x="580" y="172" class="body" text-anchor="middle" font-size="11">id breaks the tie, every frame</text>
  <text x="580" y="190" class="body" text-anchor="middle" font-size="11">stable on screen, and across builds</text>
  <rect class="panel" x="20" y="232" width="740" height="44" />
  <text x="36" y="260" class="label">The same tie-break that keeps the hash stable also stops the flicker. One rule, two payoffs.</text>
</svg>
