<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 344" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="344" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Five threats, and what each one actually is</text>
  <rect class="panel" x="20" y="42" width="740" height="268" />
  <rect class="bad" x="36" y="62" width="176" height="40" />
  <text x="124" y="87" class="label" text-anchor="middle" font-size="11">prompt injection</text>
  <text x="226" y="80" class="body" font-size="10.5">any text the agent reads is an instruction channel</text>
  <text x="226" y="96" class="mute">treat fetched content as data, never authority</text>
  <rect class="bad" x="36" y="112" width="176" height="40" />
  <text x="124" y="137" class="label" text-anchor="middle" font-size="11">excessive privilege</text>
  <text x="226" y="130" class="body" font-size="10.5">blast radius is privileges granted, not intentions held</text>
  <text x="226" y="146" class="mute">narrowest tool list, least valuable target</text>
  <rect class="bad" x="36" y="162" width="176" height="40" />
  <text x="124" y="187" class="label" text-anchor="middle" font-size="11">secret leakage</text>
  <text x="226" y="180" class="body" font-size="10.5">a key in a file is a key in every clone of that repo</text>
  <text x="226" y="196" class="mute">${ENV_VAR} everywhere — P2P distribution is irrevocable</text>
  <rect class="bad" x="36" y="212" width="176" height="40" />
  <text x="124" y="237" class="label" text-anchor="middle" font-size="11">supply chain</text>
  <text x="226" y="230" class="body" font-size="10.5">every MCP server and plugin runs with your privileges</text>
  <text x="226" y="246" class="mute">read the tool list before you install</text>
  <rect class="bad" x="36" y="262" width="176" height="40" />
  <text x="124" y="287" class="label" text-anchor="middle" font-size="11">unattended autonomy</text>
  <text x="226" y="280" class="body" font-size="10.5">a headless run has no approval gate</text>
  <text x="226" y="296" class="mute">hooks, because nobody is watching</text>
  <text x="36" y="330" class="h" font-size="12">Note that four of the five are about capability, not intent.</text>
</svg>
