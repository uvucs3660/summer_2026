<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="306" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">A plan is steps small enough to verify one at a time</text>
  <rect class="panel" x="20" y="42" width="360" height="196" />
  <text x="36" y="68" class="h" font-size="12">Not a plan</text>
  <rect class="bad" x="36" y="84" width="328" height="44" />
  <text x="48" y="104" class="body" font-size="11">1. Build the renderer seam</text>
  <text x="48" y="122" class="body" font-size="11">2. Wire it up</text>
  <text x="36" y="156" class="body">No step can be checked until</text>
  <text x="36" y="176" class="body">the whole thing is done.</text>
  <text x="36" y="196" class="body">If it is wrong you find out</text>
  <text x="36" y="216" class="body">at the end, or never.</text>
  <rect class="panel" x="400" y="42" width="360" height="196" />
  <text x="416" y="68" class="h" font-size="12">A plan</text>
  <rect class="good" x="416" y="84" width="328" height="44" />
  <text x="428" y="104" class="body" font-size="10">1. Renderer interface + headless impl</text>
  <text x="428" y="122" class="body" font-size="10">2. Vector: headless run hashes stable</text>
  <text x="416" y="156" class="body">Each step ends in something</text>
  <text x="416" y="176" class="body">you can run.</text>
  <text x="416" y="196" class="body">One step per session, so the</text>
  <text x="416" y="216" class="body">context stays small.</text>
  <rect class="panel" x="20" y="256" width="740" height="40" />
  <text x="36" y="282" class="label">The failure everybody has is starting at Execute. It feels fast for about ten minutes.</text>
</svg>
