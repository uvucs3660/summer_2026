<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="306" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Fun is your brain learning a pattern. Three consequences.</text>
  <rect class="panel" x="20" y="42" width="740" height="190" />
  <text x="36" y="68" class="h" font-size="12">Koster: fun is the feeling of successfully learning a pattern</text>
  <rect class="warn" x="36" y="86" width="300" height="40" />
  <text x="48" y="111" class="body" font-size="10.5">every mechanic has a shelf life</text>
  <text x="352" y="104" class="body" font-size="10.5">when the pattern is learned, the reward stops — plan for it</text>
  <text x="352" y="120" class="mute"></text>
  <rect class="bad" x="36" y="134" width="300" height="40" />
  <text x="48" y="159" class="body" font-size="10.5">noise is not difficulty</text>
  <text x="352" y="152" class="body" font-size="10.5">if the pattern cannot be found, it is not hard, it is unfair</text>
  <text x="352" y="168" class="mute"></text>
  <rect class="good" x="36" y="182" width="300" height="40" />
  <text x="48" y="207" class="body" font-size="10.5">the curve must track rising skill</text>
  <text x="352" y="200" class="body" font-size="10.5">constant difficulty slides into boredom on its own</text>
  <text x="352" y="216" class="mute"></text>
  <text x="36" y="252" class="h" font-size="12">A game that never changes its demands does not stay level — it falls, because the player rises.</text>
  <rect class="panel" x="20" y="262" width="740" height="34" />
  <text x="36" y="284" class="label" font-size="11">This is the argument behind difficulty curves, and behind Week 10's readable enemies.</text>
</svg>
