<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 5; ry: 5; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.4; rx: 5; ry: 5; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 5; ry: 5; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="370" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">16.6ms, and you do not get all of it</text>

  <rect class="panel" x="20" y="44" width="740" height="120" />
  <text x="36" y="68" class="body">a 60fps frame</text>

  <rect class="good" x="150" y="80" width="150" height="26" />
  <text x="225" y="98" text-anchor="middle" class="mute">simulation ~4ms</text>
  <rect class="node" x="302" y="80" width="230" height="26" />
  <text x="417" y="98" text-anchor="middle" class="mute">render ~8ms</text>
  <rect class="warn" x="534" y="80" width="90" height="26" />
  <text x="579" y="98" text-anchor="middle" class="mute">browser</text>
  <rect class="node" x="626" y="80" width="60" height="26" />
  <text x="656" y="98" text-anchor="middle" class="mute">slack</text>

  <text x="36" y="134" class="mute">The browser takes a slice for compositing and its own work. Budget for ~12ms, not 16.6.</text>
  <text x="36" y="154" class="body">One dropped frame is invisible. A dropped frame every second is what players call "stuttering".</text>

  <rect class="panel" x="20" y="182" width="365" height="170" />
  <text x="36" y="206" class="h">Order of suspicion</text>
  <text x="36" y="232" class="body">1 · O(n²) over entities — collision, AI targeting</text>
  <text x="36" y="254" class="body">2 · Allocation in the loop → GC pauses</text>
  <text x="36" y="276" class="body">3 · Draw calls — one per sprite, no batching</text>
  <text x="36" y="298" class="body">4 · Layout thrash — reading DOM every frame</text>
  <text x="36" y="320" class="body">5 · Everything else</text>
  <text x="36" y="344" class="mute">In that order. Almost always.</text>

  <rect class="panel" x="400" y="182" width="360" height="170" />
  <text x="416" y="206" class="h">The sawtooth means garbage</text>
  <text x="416" y="232" class="body">Memory rising steadily, then dropping sharply,</text>
  <text x="416" y="250" class="body">over and over, is allocation inside the loop.</text>
  <text x="416" y="276" class="code">// allocates 60x/sec, forever</text>
  <text x="416" y="294" class="code">const v = { x: a.x - b.x, y: a.y - b.y };</text>
  <text x="416" y="322" class="mute">Reuse a scratch object, or pool. Each GC pause is</text>
  <text x="416" y="338" class="mute">a visible hitch at exactly the wrong moment.</text>
</svg>
