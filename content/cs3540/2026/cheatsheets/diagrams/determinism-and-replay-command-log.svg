<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="390" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">Three sources of nondeterminism, one seam</text>

  <rect class="node" x="20" y="50" width="180" height="44" />
  <text x="110" y="70" text-anchor="middle" class="label">player input</text>
  <text x="110" y="87" text-anchor="middle" class="mute">click, key, drag</text>

  <rect class="node" x="20" y="106" width="180" height="44" />
  <text x="110" y="126" text-anchor="middle" class="label">remote peer</text>
  <text x="110" y="143" text-anchor="middle" class="mute">over Hyperswarm</text>

  <rect class="warn" x="20" y="162" width="180" height="44" />
  <text x="110" y="182" text-anchor="middle" class="label">LLM reply</text>
  <text x="110" y="199" text-anchor="middle" class="mute">nondeterministic!</text>

  <path d="M 204 72  L 258 118" class="arrow" />
  <path d="M 204 128 L 258 128" class="arrow" />
  <path d="M 204 184 L 258 138" class="arrow" />

  <rect class="good" x="262" y="100" width="180" height="56" />
  <text x="352" y="124" text-anchor="middle" class="label">command log</text>
  <text x="352" y="143" text-anchor="middle" class="mute">append-only · sorted by tick</text>

  <path d="M 446 128 L 500 128" class="arrow" />

  <rect class="node" x="504" y="96" width="256" height="64" />
  <text x="632" y="120" text-anchor="middle" class="label">deterministic simulation</text>
  <text x="632" y="139" text-anchor="middle" class="mute">seed + log ⇒ always the same</text>
  <text x="632" y="154" text-anchor="middle" class="code">stateHash()</text>

  <rect class="panel" x="20" y="224" width="740" height="150" />
  <text x="36" y="248" class="h">Why the LLM does not break replay</text>

  <text x="36" y="276" class="body">The model is nondeterministic. The <tspan class="label">recorded reply</tspan> is not.</text>
  <text x="36" y="298" class="body">Ask once, write the answer into the log as a command, and every later replay reads the log —</text>
  <text x="36" y="316" class="body">never the model. The run reproduces exactly, offline, for free, forever.</text>

  <text x="36" y="348" class="mute">This is the same mechanism lockstep netcode uses for a remote player: you do not re-derive what</text>
  <text x="36" y="364" class="mute">they did, you replay what they sent. One seam handles input, multiplayer, and generative NPCs.</text>
</svg>
