<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
  </style>

  <text x="20" y="26" class="h" font-size="15">Three places a story can live — only one of them is cheap</text>

  <rect class="node" x="20" y="46" width="235" height="130" />
  <text x="137" y="70" text-anchor="middle" class="label">TOLD</text>
  <text x="137" y="94" text-anchor="middle" class="body">cutscenes, dialogue, text</text>
  <text x="137" y="118" text-anchor="middle" class="mute">precise control, expensive,</text>
  <text x="137" y="134" text-anchor="middle" class="mute">and the player is not playing</text>
  <text x="137" y="160" text-anchor="middle" class="mute">costs: writing + voice + time</text>

  <rect class="good" x="272" y="46" width="235" height="130" />
  <text x="389" y="70" text-anchor="middle" class="label">SHOWN</text>
  <text x="389" y="94" text-anchor="middle" class="body">the environment itself</text>
  <text x="389" y="118" text-anchor="middle" class="mute">two skeletons and a locked</text>
  <text x="389" y="134" text-anchor="middle" class="mute">door tell a whole story</text>
  <text x="389" y="160" text-anchor="middle" class="mute">costs: level layout you needed anyway</text>

  <rect class="node" x="524" y="46" width="236" height="130" />
  <text x="642" y="70" text-anchor="middle" class="label">PLAYED</text>
  <text x="642" y="94" text-anchor="middle" class="body">what the systems make happen</text>
  <text x="642" y="118" text-anchor="middle" class="mute">the story of your own</text>
  <text x="642" y="134" text-anchor="middle" class="mute">desperate last stand</text>
  <text x="642" y="160" text-anchor="middle" class="mute">costs: nothing — it emerges</text>

  <rect class="warn" x="20" y="196" width="740" height="80" />
  <text x="36" y="218" class="label">Ludonarrative dissonance</text>
  <text x="36" y="242" class="body">When the story says one thing and the mechanics say another. A protagonist described as merciful</text>
  <text x="36" y="260" class="body">who has killed four hundred people. Players believe the mechanics, always.</text>

  <rect class="panel" x="20" y="292" width="740" height="72" />
  <text x="36" y="316" class="h">For a one-term project, spend here</text>
  <text x="36" y="342" class="body">Environmental storytelling gives the most narrative per hour of work — it rides on level design you</text>
  <text x="36" y="360" class="body">were building regardless, and it never stops the player from playing.</text>
</svg>
