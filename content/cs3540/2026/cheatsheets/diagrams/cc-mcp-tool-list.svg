<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="316" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">The question is not “is it trustworthy”</text>
  <rect class="panel" x="20" y="42" width="740" height="40" />
  <text x="36" y="68" class="label">An MCP server runs with your privileges. Read the tool list, not the README.</text>
  <rect class="panel" x="20" y="96" width="360" height="152" />
  <text x="36" y="122" class="h" font-size="13">“database access”</text>
  <rect class="good" x="36" y="136" width="328" height="28" />
  <text x="48" y="155" class="code" font-size="12">query_readonly</text>
  <rect class="good" x="36" y="168" width="328" height="28" />
  <text x="48" y="187" class="code" font-size="12">list_tables</text>
  <rect class="good" x="36" y="200" width="328" height="28" />
  <text x="48" y="219" class="code" font-size="12">describe_schema</text>
  <text x="36" y="240" class="mute">cannot drop a table</text>
  <rect class="panel" x="400" y="96" width="360" height="152" />
  <text x="416" y="122" class="h" font-size="13">“database access”</text>
  <rect class="good" x="416" y="136" width="328" height="28" />
  <text x="428" y="155" class="code" font-size="12">query_readonly</text>
  <rect class="bad" x="416" y="168" width="328" height="28" />
  <text x="428" y="187" class="code" font-size="12">execute_sql</text>
  <rect class="bad" x="416" y="200" width="328" height="28" />
  <text x="428" y="219" class="code" font-size="12">run_migration</text>
  <text x="416" y="240" class="mute">can drop every table you own</text>
  <rect class="panel" x="20" y="262" width="740" height="40" />
  <text x="36" y="288" class="label">Same description. Same category. The blast radius is in the tool list.</text>
</svg>
