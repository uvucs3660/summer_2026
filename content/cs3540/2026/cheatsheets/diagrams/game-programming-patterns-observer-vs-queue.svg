<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="316" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Inside the simulation, prefer the queue</text>
  <rect class="panel" x="20" y="42" width="740" height="122" />
  <text x="36" y="68" class="h" font-size="13">Synchronous observer — fires mid-tick</text>
  <rect class="node" x="36" y="82" width="170" height="34" />
  <text x="121" y="104" class="label" text-anchor="middle" font-size="11">movement runs</text>
  <path class="warrow" d="M 210 99 L 238 99" />
  <rect class="warn" x="242" y="82" width="170" height="34" />
  <text x="327" y="104" class="label" text-anchor="middle" font-size="11">emit damaged</text>
  <path class="warrow" d="M 416 99 L 444 99" />
  <rect class="bad" x="448" y="82" width="296" height="34" />
  <text x="596" y="104" class="label" text-anchor="middle" font-size="10">listener mutates what collision is reading</text>
  <text x="36" y="140" class="body" font-size="11">The bug depends on which system happened to run first — order-dependent, and nearly unreproducible.</text>
  <rect class="panel" x="20" y="178" width="740" height="122" />
  <text x="36" y="204" class="h" font-size="13">Event queue — drained at a point you chose</text>
  <rect class="node" x="36" y="218" width="170" height="34" />
  <text x="121" y="240" class="label" text-anchor="middle" font-size="11">movement runs</text>
  <path class="arrow" d="M 210 235 L 238 235" />
  <rect class="node" x="242" y="218" width="170" height="34" />
  <text x="327" y="240" class="label" text-anchor="middle" font-size="11">append to queue</text>
  <path class="arrow" d="M 416 235 L 444 235" />
  <rect class="good" x="448" y="218" width="296" height="34" />
  <text x="596" y="240" class="label" text-anchor="middle" font-size="10">drained after every system has run</text>
  <text x="36" y="276" class="body" font-size="11">Nothing mutates while another system is mid-read. The drain point is part of your specification.</text>
</svg>
