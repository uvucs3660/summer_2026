<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.3; rx: 6; ry: 6; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.4; rx: 6; ry: 6; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 6; ry: 6; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .line  { stroke: #6b7280; stroke-width: 1.4; }
  </style>

  <text x="20" y="26" class="h" font-size="15">Inheritance asks "what is it?" Composition asks "what does it have?"</text>

  <rect class="warn" x="20" y="46" width="330" height="170" />
  <text x="36" y="68" class="label">Inheritance — collapses at entity #5</text>
  <rect class="node" x="120" y="82" width="120" height="28" /><text x="180" y="101" text-anchor="middle" class="body">Entity</text>
  <line x1="180" y1="110" x2="180" y2="124" class="line" />
  <rect class="node" x="60" y="124" width="110" height="28" /><text x="115" y="143" text-anchor="middle" class="body">Monster</text>
  <rect class="node" x="190" y="124" width="110" height="28" /><text x="245" y="143" text-anchor="middle" class="body">Prop</text>
  <line x1="115" y1="152" x2="115" y2="166" class="line" />
  <rect class="node" x="60" y="166" width="110" height="28" /><text x="115" y="185" text-anchor="middle" class="body">FlyingMonster</text>
  <text x="36" y="208" class="mute">Now: a flying prop that shoots. Which parent?</text>

  <rect class="good" x="370" y="46" width="390" height="170" />
  <text x="386" y="68" class="label">Composition — an id plus whatever it has</text>
  <text x="386" y="94"  class="code">entity 7 = { Position, Sprite, Health, Flying }</text>
  <text x="386" y="114" class="code">entity 8 = { Position, Sprite }</text>
  <text x="386" y="134" class="code">entity 9 = { Position, Health, Weapon, Flying }</text>
  <text x="386" y="164" class="body">A flying prop that shoots is just a different set.</text>
  <text x="386" y="182" class="body">No new class. No hierarchy to renegotiate.</text>
  <text x="386" y="204" class="mute">Behavior follows from which components exist.</text>

  <rect class="panel" x="20" y="234" width="740" height="150" />
  <text x="36" y="258" class="h">The store: one map per component type</text>
  <text x="36" y="284" class="code">positions: Map&lt;id, {x, y}&gt;      health: Map&lt;id, {hp}&gt;      sprites: Map&lt;id, {tex}&gt;</text>
  <text x="36" y="314" class="body">A system asks for the entities that have what it needs, and ignores the rest:</text>
  <text x="36" y="338" class="code">for (const [id, pos] of positions) { const v = velocities.get(id); if (!v) continue; ... }</text>
  <text x="36" y="368" class="mute">Iterate in ascending id order — never map insertion order — or two correct builds will hash differently.</text>
</svg>
