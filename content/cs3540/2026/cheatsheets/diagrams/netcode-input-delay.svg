<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="296" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Commands are scheduled ahead, not applied on arrival</text>
  <rect class="panel" x="20" y="42" width="740" height="130" />
  <text x="36" y="68" class="h" font-size="12">you press a key during tick 40</text>
  <rect class="node" x="36" y="84" width="164" height="56" />
  <text x="118" y="108" class="label" text-anchor="middle" font-size="11">press</text>
  <text x="118" y="128" class="code" text-anchor="middle" font-size="11">tick 40</text>
  <path class="arrow" d="M 204 112 L 214 112" />
  <rect class="warn" x="218" y="84" width="164" height="56" />
  <text x="300" y="108" class="label" text-anchor="middle" font-size="11">send</text>
  <text x="300" y="128" class="code" text-anchor="middle" font-size="11">for tick 43</text>
  <path class="arrow" d="M 386 112 L 396 112" />
  <rect class="good" x="400" y="84" width="164" height="56" />
  <text x="482" y="108" class="label" text-anchor="middle" font-size="11">every peer has it</text>
  <text x="482" y="128" class="code" text-anchor="middle" font-size="11">before tick 43</text>
  <path class="arrow" d="M 568 112 L 578 112" />
  <rect class="good" x="582" y="84" width="164" height="56" />
  <text x="664" y="108" class="label" text-anchor="middle" font-size="11">applied</text>
  <text x="664" y="128" class="code" text-anchor="middle" font-size="11">tick 43</text>
  <text x="36" y="162" class="mute">three ticks of headroom, so the command arrives before it is needed</text>
  <rect class="panel" x="20" y="186" width="740" height="42" />
  <text x="36" y="214" class="label">At 20Hz that is 150ms of hidden latency — which is why RTS games feel slightly heavy.</text>
  <rect class="panel" x="20" y="242" width="740" height="42" />
  <text x="36" y="270" class="label">It is not a defect. It is the price of every peer computing the same world with no server.</text>
</svg>
