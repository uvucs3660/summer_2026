<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 316" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="316" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Four groups, one axis running through all of them</text>
  <rect class="panel" x="20" y="42" width="175" height="178" />
  <text x="34" y="68" class="h" font-size="12">Context</text>
  <text x="34" y="86" class="mute">what it knows</text>
  <rect class="node" x="34" y="100" width="147" height="28" />
  <text x="107" y="119" class="body" text-anchor="middle" font-size="10.5">CLAUDE.md</text>
  <rect class="node" x="34" y="134" width="147" height="28" />
  <text x="107" y="153" class="body" text-anchor="middle" font-size="10.5">skills</text>
  <rect class="node" x="34" y="168" width="147" height="28" />
  <text x="107" y="187" class="body" text-anchor="middle" font-size="10.5">memory</text>
  <rect class="panel" x="207" y="42" width="175" height="178" />
  <text x="221" y="68" class="h" font-size="12">Capability</text>
  <text x="221" y="86" class="mute">what it can do</text>
  <rect class="node" x="221" y="100" width="147" height="28" />
  <text x="294" y="119" class="body" text-anchor="middle" font-size="10.5">tools</text>
  <rect class="node" x="221" y="134" width="147" height="28" />
  <text x="294" y="153" class="body" text-anchor="middle" font-size="10.5">MCP</text>
  <rect class="node" x="221" y="168" width="147" height="28" />
  <text x="294" y="187" class="body" text-anchor="middle" font-size="10.5">subagents</text>
  <rect class="panel" x="394" y="42" width="175" height="178" />
  <text x="408" y="68" class="h" font-size="12">Control</text>
  <text x="408" y="86" class="mute">what it may do</text>
  <rect class="node" x="408" y="100" width="147" height="28" />
  <text x="481" y="119" class="body" text-anchor="middle" font-size="10.5">permissions</text>
  <rect class="node" x="408" y="134" width="147" height="28" />
  <text x="481" y="153" class="body" text-anchor="middle" font-size="10.5">hooks</text>
  <rect class="node" x="408" y="168" width="147" height="28" />
  <text x="481" y="187" class="body" text-anchor="middle" font-size="10.5">modes</text>
  <rect class="panel" x="581" y="42" width="175" height="178" />
  <text x="595" y="68" class="h" font-size="12">Communication</text>
  <text x="595" y="86" class="mute">how you steer</text>
  <rect class="node" x="595" y="100" width="147" height="28" />
  <text x="668" y="119" class="body" text-anchor="middle" font-size="10.5">prompts</text>
  <rect class="node" x="595" y="134" width="147" height="28" />
  <text x="668" y="153" class="body" text-anchor="middle" font-size="10.5">plugins</text>
  <rect class="panel" x="20" y="236" width="740" height="62" />
  <text x="36" y="262" class="label">The recurring question: what is always in context, versus what loads on demand?</text>
  <text x="36" y="284" class="body">Almost every “where does this belong?” decision reduces to that one.</text>
</svg>
