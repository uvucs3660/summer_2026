<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="286" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">The only pillar that is not a request</text>
  <rect class="panel" x="20" y="42" width="740" height="44" />
  <text x="36" y="70" class="label">Everything else in Claude Code asks a model. A hook is a shell script with an exit code.</text>
  <rect class="good" x="36" y="102" width="130" height="44" />
  <text x="101" y="129" class="code" text-anchor="middle" font-size="13">exit 0</text>
  <text x="184" y="122" class="body" font-size="11">allow — the tool call proceeds</text>
  <text x="184" y="140" class="mute">silence is consent</text>
  <rect class="warn" x="36" y="160" width="130" height="44" />
  <text x="101" y="187" class="code" text-anchor="middle" font-size="13">exit 1</text>
  <text x="184" y="180" class="body" font-size="11">non-blocking error — logged, then proceeds</text>
  <text x="184" y="198" class="mute">your stderr is advisory</text>
  <rect class="bad" x="36" y="218" width="130" height="44" />
  <text x="101" y="245" class="code" text-anchor="middle" font-size="13">exit 2</text>
  <text x="184" y="238" class="body" font-size="11">BLOCK — the tool call never runs</text>
  <text x="184" y="256" class="mute">stderr is handed back as the reason</text>
  <text x="36" y="278" class="h" font-size="12">A guard you have only ever seen allow has not been shown to guard.</text>
</svg>
