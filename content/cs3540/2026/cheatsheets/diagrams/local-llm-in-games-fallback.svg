<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="292" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">The fallback is the deliverable</text>
  <rect class="panel" x="20" y="42" width="740" height="42" />
  <text x="36" y="70" class="label">A conformance vector kills every provider and checks that the game still runs — and says so.</text>
  <rect class="good" x="36" y="100" width="300" height="40" />
  <text x="48" y="125" class="body" font-size="11">cloud endpoint up</text>
  <path class="arrow" d="M 344 120 L 368 120" />
  <rect class="node" x="376" y="100" width="368" height="40" />
  <text x="388" y="125" class="body" font-size="11">generated dialogue, cached to the log</text>
  <rect class="warn" x="36" y="152" width="300" height="40" />
  <text x="48" y="177" class="body" font-size="11">endpoint rate-limited</text>
  <path class="arrow" d="M 344 172 L 368 172" />
  <rect class="node" x="376" y="152" width="368" height="40" />
  <text x="388" y="177" class="body" font-size="11">local model, or authored lines</text>
  <rect class="good" x="36" y="204" width="300" height="40" />
  <text x="48" y="229" class="body" font-size="11">nothing available at all</text>
  <path class="arrow" d="M 344 224 L 368 224" />
  <rect class="node" x="376" y="204" width="368" height="40" />
  <text x="388" y="229" class="body" font-size="11">authored lines, and the player is told</text>
  <text x="36" y="278" class="h" font-size="12">Not “fails gracefully” — keeps playing, with authored lines, and tells the player.</text>
</svg>
