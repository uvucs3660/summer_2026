<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="306" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">An unranked list of values is decoration</text>
  <rect class="panel" x="20" y="42" width="360" height="196" />
  <text x="36" y="68" class="h" font-size="12">Unranked</text>
  <rect class="warn" x="36" y="84" width="328" height="26" />
  <text x="48" y="102" class="body" font-size="11">clarity</text>
  <rect class="warn" x="36" y="116" width="328" height="26" />
  <text x="48" y="134" class="body" font-size="11">elegance</text>
  <rect class="warn" x="36" y="148" width="328" height="26" />
  <text x="48" y="166" class="body" font-size="11">speed</text>
  <rect class="warn" x="36" y="180" width="328" height="26" />
  <text x="48" y="198" class="body" font-size="11">rigour</text>
  <text x="36" y="232" class="body">Every one of these is agreeable.</text>
  <text x="36" y="252" class="body">None of them decides anything.</text>
  <rect class="panel" x="400" y="42" width="360" height="196" />
  <text x="416" y="68" class="h" font-size="12">Ranked</text>
  <rect class="good" x="416" y="84" width="328" height="26" />
  <text x="428" y="102" class="body" font-size="11">1. unambiguous</text>
  <rect class="good" x="416" y="116" width="328" height="26" />
  <text x="428" y="134" class="body" font-size="11">2. rigorous</text>
  <rect class="good" x="416" y="148" width="328" height="26" />
  <text x="428" y="166" class="body" font-size="11">3. clear</text>
  <rect class="good" x="416" y="180" width="328" height="26" />
  <text x="428" y="198" class="body" font-size="11">4. elegant</text>
  <text x="416" y="232" class="body">“Unambiguous over elegant” tells it</text>
  <text x="416" y="252" class="body">what to do when the precise sentence is ugly.</text>
  <rect class="panel" x="20" y="264" width="740" height="34" />
  <text x="36" y="286" class="label" font-size="11">The whole purpose is resolving conflicts — and a tie is exactly where you needed an answer.</text>
</svg>
