<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="330" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">The test: could someone build this in another language?</text>
  <rect class="panel" x="20" y="42" width="360" height="196" />
  <text x="36" y="68" class="h" font-size="13">Fails the test</text>
  <rect class="bad" x="36" y="82" width="328" height="74" />
  <text x="48" y="104" class="code">const q = Math.round(x * 1000);</text>
  <text x="48" y="122" class="code">return entities.map(e =&gt; ...)</text>
  <text x="48" y="142" class="body" font-size="11">a TypeScript dump wearing a spec's name</text>
  <text x="36" y="178" class="body">Inherits the host language's rounding.</text>
  <text x="36" y="198" class="body">Says how, never what.</text>
  <text x="36" y="218" class="body">A Dart build cannot follow it.</text>
  <rect class="panel" x="400" y="42" width="360" height="196" />
  <text x="416" y="68" class="h" font-size="13">Passes the test</text>
  <rect class="good" x="416" y="82" width="328" height="74" />
  <text x="428" y="104" class="body" font-size="11">Positions quantize at x1000.</text>
  <text x="428" y="122" class="body" font-size="11">Rounding is half away from zero.</text>
  <text x="428" y="142" class="body" font-size="11">Ties break by ascending entity id.</text>
  <text x="416" y="178" class="body">States behavior and invariants.</text>
  <text x="416" y="198" class="body">Names the rounding and the tie-break.</text>
  <text x="416" y="218" class="body">Two languages cannot disagree.</text>
  <rect class="panel" x="20" y="254" width="740" height="60" />
  <text x="36" y="280" class="label">“It must be implementable in a second language.”</text>
  <text x="36" y="302" class="body">That is the main guard against writing code and calling it a specification.</text>
</svg>
