<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="366" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Ships means: it runs on a machine that is not yours</text>
  <rect class="panel" x="20" y="42" width="740" height="42" />
  <text x="36" y="70" class="label">“Bring a build that works without the campus network.” That sentence is the whole final exam.</text>
  <rect class="panel" x="20" y="96" width="740" height="214" />
  <rect class="good" x="36" y="110" width="250" height="32" />
  <text x="48" y="131" class="body" font-size="10.5">no network at all</text>
  <path class="arrow" d="M 294 126 L 316 126" />
  <text x="326" y="131" class="body" font-size="10.5">authored fallback, and the player is told</text>
  <rect class="good" x="36" y="150" width="250" height="32" />
  <text x="48" y="171" class="body" font-size="10.5">a machine with no repo</text>
  <path class="arrow" d="M 294 166 L 316 166" />
  <text x="326" y="171" class="body" font-size="10.5">the build is self-contained — assets included</text>
  <rect class="warn" x="36" y="190" width="250" height="32" />
  <text x="48" y="211" class="body" font-size="10.5">a grader with no context</text>
  <path class="arrow" d="M 294 206 L 316 206" />
  <text x="326" y="211" class="body" font-size="10.5">README says how to run it, in two lines</text>
  <rect class="warn" x="36" y="230" width="250" height="32" />
  <text x="48" y="251" class="body" font-size="10.5">every generated asset</text>
  <path class="arrow" d="M 294 246 L 316 246" />
  <text x="326" y="251" class="body" font-size="10.5">a provenance entry: model, prompt, seed, license</text>
  <rect class="bad" x="36" y="270" width="250" height="32" />
  <text x="48" y="291" class="body" font-size="10.5">the frame budget</text>
  <path class="arrow" d="M 294 286 L 316 286" />
  <text x="326" y="291" class="body" font-size="10.5">measured on the worst machine you can find</text>
  <rect class="panel" x="20" y="322" width="740" height="34" />
  <text x="36" y="344" class="label" font-size="11">Every one of these fails on someone else's machine, never on yours.</text>
</svg>
