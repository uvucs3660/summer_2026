<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.3; rx: 6; ry: 6; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.4; rx: 6; ry: 6; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 6; ry: 6; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">Every unpinned choice is a place two builds can differ</text>

  <rect class="warn" x="20" y="46" width="360" height="150" />
  <text x="36" y="68" class="label">"Sort the entities and round the positions."</text>
  <text x="36" y="94"  class="body">Sort by what? Ascending or descending?</text>
  <text x="36" y="112" class="body">Ties broken how?</text>
  <text x="36" y="130" class="body">Round to how many places?</text>
  <text x="36" y="148" class="body">Round half up, or half away from zero?</text>
  <text x="36" y="176" class="mute">Four unpinned choices. Two builds. Sixteen possible readings.</text>

  <rect class="good" x="400" y="46" width="360" height="150" />
  <text x="416" y="68" class="label">"Sort entities by ascending id. Quantize</text>
  <text x="416" y="85" class="label">position by 1000, rounding half away</text>
  <text x="416" y="102" class="label">from zero."</text>
  <text x="416" y="130" class="body">Ids are unique, so ties cannot occur.</text>
  <text x="416" y="148" class="body">Rounding named, not inherited from the host.</text>
  <text x="416" y="176" class="mute">One reading. Two builds agree. Nothing to fix.</text>

  <rect class="panel" x="20" y="212" width="740" height="170" />
  <text x="36" y="236" class="h">The five questions to ask every sentence you write</text>

  <rect class="node" x="36" y="250" width="138" height="52" />
  <text x="105" y="270" text-anchor="middle" class="label">ORDER</text>
  <text x="105" y="288" text-anchor="middle" class="mute">by what, which way?</text>

  <rect class="node" x="184" y="250" width="138" height="52" />
  <text x="253" y="270" text-anchor="middle" class="label">UNITS</text>
  <text x="253" y="288" text-anchor="middle" class="mute">ms or seconds?</text>

  <rect class="node" x="332" y="250" width="138" height="52" />
  <text x="401" y="270" text-anchor="middle" class="label">BOUNDARY</text>
  <text x="401" y="288" text-anchor="middle" class="mute">inclusive or not?</text>

  <rect class="node" x="480" y="250" width="138" height="52" />
  <text x="549" y="270" text-anchor="middle" class="label">TIES</text>
  <text x="549" y="288" text-anchor="middle" class="mute">who wins?</text>

  <rect class="node" x="628" y="250" width="116" height="52" />
  <text x="686" y="270" text-anchor="middle" class="label">EMPTY</text>
  <text x="686" y="288" text-anchor="middle" class="mute">zero of them?</text>

  <text x="36" y="330" class="body">If a sentence survives all five without needing a change, it is probably unambiguous. Most do not.</text>
  <text x="36" y="356" class="mute">The test that matters: could someone implement this in Rust, without asking you a question, and</text>
  <text x="36" y="371" class="mute">produce the same state hash as the TypeScript build? If not, keep writing.</text>
</svg>
