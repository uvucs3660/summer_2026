<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="322" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Inheritance can express one axis. Games have several.</text>
  <rect class="panel" x="20" y="42" width="360" height="210" />
  <text x="36" y="68" class="h" font-size="13">What is it?</text>
  <rect class="node" x="140" y="82" width="120" height="28" />
  <text x="200" y="101" class="label" text-anchor="middle" font-size="11">Entity</text>
  <rect class="node" x="60" y="126" width="120" height="28" />
  <text x="120" y="145" class="label" text-anchor="middle" font-size="11">Monster</text>
  <rect class="node" x="220" y="126" width="120" height="28" />
  <text x="280" y="145" class="label" text-anchor="middle" font-size="11">Prop</text>
  <rect class="node" x="60" y="170" width="120" height="28" />
  <text x="120" y="189" class="label" text-anchor="middle" font-size="10">FlyingMonster</text>
  <path class="arrow" d="M 180 110 L 130 122" />
  <path class="arrow" d="M 220 110 L 270 122" />
  <path class="arrow" d="M 120 154 L 120 166" />
  <rect class="bad" x="200" y="170" width="160" height="28" />
  <text x="280" y="189" class="label" text-anchor="middle" font-size="10">a flying prop that shoots</text>
  <text x="36" y="224" class="mute">Which parent? Both. Neither. The hierarchy</text>
  <text x="36" y="240" class="mute">only has room for one answer.</text>
  <rect class="panel" x="400" y="42" width="360" height="210" />
  <text x="416" y="68" class="h" font-size="13">What does it have?</text>
  <text x="416" y="92" class="body" font-size="11">flying prop that shoots =</text>
  <rect class="good" x="416" y="104" width="328" height="24" />
  <text x="430" y="121" class="label" font-size="11">Transform</text>
  <rect class="good" x="416" y="132" width="328" height="24" />
  <text x="430" y="149" class="label" font-size="11">Sprite</text>
  <rect class="good" x="416" y="160" width="328" height="24" />
  <text x="430" y="177" class="label" font-size="11">Flying</text>
  <rect class="good" x="416" y="188" width="328" height="24" />
  <text x="430" y="205" class="label" font-size="11">Shooter</text>
  <rect class="good" x="416" y="216" width="328" height="24" />
  <text x="430" y="233" class="label" font-size="11">Health</text>
  <text x="416" y="264" class="mute"></text>
  <rect class="panel" x="20" y="266" width="740" height="40" />
  <text x="36" y="292" class="label">Composition adds an axis by adding a component. Inheritance adds one by rewriting the tree.</text>
</svg>
