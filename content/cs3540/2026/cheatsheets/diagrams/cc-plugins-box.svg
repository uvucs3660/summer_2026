<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 6; ry: 6; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 6; ry: 6; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #fcd34d; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">A plugin is the box. The other pillars are the contents.</text>

  <rect class="panel" x="20" y="46" width="330" height="250" />
  <text x="36" y="70" class="h">my-toolkit/</text>
  <rect class="node" x="36" y="82" width="290" height="30" />
  <text x="50" y="102" class="code">.claude-plugin/plugin.json</text>
  <rect class="good" x="36" y="120" width="290" height="30" />
  <text x="50" y="140" class="code">skills/pr-summary/SKILL.md</text>
  <rect class="good" x="36" y="158" width="290" height="30" />
  <text x="50" y="178" class="code">agents/test-runner.md</text>
  <rect class="good" x="36" y="196" width="290" height="30" />
  <text x="50" y="216" class="code">hooks/hooks.json</text>
  <rect class="good" x="36" y="234" width="290" height="30" />
  <text x="50" y="254" class="code">.mcp.json</text>
  <text x="36" y="286" class="mute">Four capability types, versioned together.</text>

  <rect class="good" x="410" y="86" width="350" height="70" />
  <text x="585" y="112" text-anchor="middle" class="label">/plugin install</text>
  <text x="585" y="134" text-anchor="middle" class="mute">one command delivers all of it</text>

  <path d="M 354 120 L 406 120" class="arrow" />

  <rect class="panel" x="410" y="176" width="350" height="120" />
  <text x="426" y="200" class="h">The portability rule</text>
  <text x="426" y="226" class="code">${CLAUDE_PLUGIN_ROOT}/scripts/guard.sh</text>
  <text x="426" y="254" class="body">Every in-plugin path uses it. An absolute path</text>
  <text x="426" y="272" class="body">works on your machine and nowhere else —</text>
  <text x="426" y="290" class="body">and fails silently for whoever installs it.</text>
</svg>
