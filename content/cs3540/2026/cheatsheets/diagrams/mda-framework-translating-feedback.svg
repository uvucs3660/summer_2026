<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="292" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Players report problems accurately and propose solutions badly</text>
  <rect class="panel" x="20" y="42" width="740" height="158" />
  <text x="36" y="90" class="mute">aesthetic — what they felt</text>
  <rect class="bad" x="250" y="68" width="494" height="34" />
  <text x="262" y="90" class="label" font-size="11">“the boss is unfair”</text>
  <path class="arrow" d="M 497 104 L 497 110" />
  <text x="36" y="134" class="mute">dynamic — what happened</text>
  <rect class="warn" x="250" y="112" width="494" height="34" />
  <text x="262" y="134" class="label" font-size="11">“I die before I can react to the slam”</text>
  <path class="arrow" d="M 497 148 L 497 154" />
  <text x="36" y="178" class="mute">mechanic — what you can edit</text>
  <rect class="good" x="250" y="156" width="494" height="34" />
  <text x="262" y="178" class="label" font-size="11">wind-up is 8 frames — make it 20</text>
  <text x="36" y="222" class="h" font-size="12">The obvious fix — less boss health — would not have touched the problem.</text>
  <rect class="panel" x="20" y="236" width="740" height="44" />
  <text x="36" y="264" class="label">You can only edit mechanics. You only care about aesthetics. Dynamics is the gap in between.</text>
</svg>
