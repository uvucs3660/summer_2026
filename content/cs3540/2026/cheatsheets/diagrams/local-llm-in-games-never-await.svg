<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="306" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Never await inside the tick</text>
  <rect class="panel" x="20" y="42" width="740" height="42" />
  <text x="36" y="70" class="label">You have 16.6ms. The model takes 500–3000ms. That is not a tuning problem.</text>
  <rect class="panel" x="20" y="96" width="360" height="152" />
  <text x="36" y="122" class="h" font-size="12">await in tick()</text>
  <rect class="bad" x="36" y="138" width="328" height="40" />
  <text x="200" y="163" class="label" text-anchor="middle" font-size="11">the whole game stops</text>
  <text x="36" y="202" class="body">The frame never finishes. The</text>
  <text x="36" y="222" class="body">accumulator fills. On the next</text>
  <text x="36" y="242" class="body">frame you are in the spiral.</text>
  <rect class="panel" x="400" y="96" width="360" height="152" />
  <text x="416" y="122" class="h" font-size="12">fire, keep playing</text>
  <rect class="good" x="416" y="138" width="328" height="40" />
  <text x="580" y="163" class="label" text-anchor="middle" font-size="11">the reply arrives as a command</text>
  <text x="416" y="202" class="body">Request goes out. Ticks continue.</text>
  <text x="416" y="222" class="body">Two seconds later the answer is</text>
  <text x="416" y="242" class="body">appended to the log, like any input.</text>
  <rect class="panel" x="20" y="262" width="740" height="34" />
  <text x="36" y="284" class="label" font-size="11">The seam already existed — it is the same one a remote peer arrives through. Week 3.</text>
</svg>
