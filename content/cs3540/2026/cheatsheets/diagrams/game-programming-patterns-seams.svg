<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 336" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="336" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Three seams, each a Strategy chosen by configuration</text>
  <rect class="panel" x="20" y="42" width="740" height="44" />
  <text x="390" y="70" class="label" text-anchor="middle">“The simulation must not know that rendering exists.”</text>
  <rect class="panel" x="20" y="98" width="240" height="176" />
  <text x="36" y="124" class="h" font-size="13">Renderer</text>
  <rect class="node" x="36" y="138" width="208" height="32" />
  <text x="140" y="159" class="label" text-anchor="middle" font-size="11">2D canvas</text>
  <rect class="node" x="36" y="176" width="208" height="32" />
  <text x="140" y="197" class="label" text-anchor="middle" font-size="11">3D — WebGL2</text>
  <rect class="good" x="36" y="214" width="208" height="32" />
  <text x="140" y="235" class="label" text-anchor="middle" font-size="11">headless</text>
  <text x="36" y="256" class="mute">conformance runs headless</text>
  <rect class="panel" x="270" y="98" width="240" height="176" />
  <text x="286" y="124" class="h" font-size="13">Transport</text>
  <rect class="node" x="286" y="138" width="208" height="32" />
  <text x="390" y="159" class="label" text-anchor="middle" font-size="11">local / hotseat</text>
  <rect class="node" x="286" y="176" width="208" height="32" />
  <text x="390" y="197" class="label" text-anchor="middle" font-size="11">Pear — Hyperswarm</text>
  <rect class="node" x="286" y="214" width="208" height="32" />
  <text x="390" y="235" class="label" text-anchor="middle" font-size="11">WebRTC</text>
  <text x="286" y="256" class="mute">multiplayer, no server</text>
  <rect class="panel" x="520" y="98" width="240" height="176" />
  <text x="536" y="124" class="h" font-size="13">Generator</text>
  <rect class="good" x="536" y="138" width="208" height="32" />
  <text x="640" y="159" class="label" text-anchor="middle" font-size="11">procedural</text>
  <rect class="node" x="536" y="176" width="208" height="32" />
  <text x="640" y="197" class="label" text-anchor="middle" font-size="11">local Ollama</text>
  <rect class="node" x="536" y="214" width="208" height="32" />
  <text x="640" y="235" class="label" text-anchor="middle" font-size="11">class endpoint</text>
  <text x="536" y="256" class="mute">procedural always works</text>
  <rect class="panel" x="20" y="288" width="740" height="34" />
  <text x="36" y="310" class="label">Chosen by configuration — never by an if inside the simulation.</text>
</svg>
