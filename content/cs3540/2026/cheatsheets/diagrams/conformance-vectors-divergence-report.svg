<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="330" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">How a disagreement finds its owner</text>
  <rect class="panel" x="20" y="42" width="740" height="132" />
  <text x="36" y="68" class="h" font-size="12">The same vector, run against independent builds</text>
  <rect class="good" x="36" y="84" width="164" height="62" />
  <text x="118" y="108" class="label" text-anchor="middle" font-size="11">build A</text>
  <text x="118" y="130" class="code" text-anchor="middle" font-size="12">0xFC13A2</text>
  <rect class="good" x="218" y="84" width="164" height="62" />
  <text x="300" y="108" class="label" text-anchor="middle" font-size="11">build B</text>
  <text x="300" y="130" class="code" text-anchor="middle" font-size="12">0xFC13A2</text>
  <rect class="good" x="400" y="84" width="164" height="62" />
  <text x="482" y="108" class="label" text-anchor="middle" font-size="11">build C</text>
  <text x="482" y="130" class="code" text-anchor="middle" font-size="12">0xFC13A2</text>
  <rect class="bad" x="582" y="84" width="164" height="62" />
  <text x="664" y="108" class="label" text-anchor="middle" font-size="11">build D</text>
  <text x="664" y="130" class="code" text-anchor="middle" font-size="12">0x9B0E41</text>
  <text x="36" y="166" class="mute">three agree, one does not — the majority is promoted and tagged</text>
  <path class="warrow" d="M 664 178 L 664 196" />
  <rect class="panel" x="20" y="200" width="740" height="44" />
  <text x="36" y="228" class="label">The failing vector names a section. The section names an owner. That is the whole loop.</text>
  <rect class="panel" x="20" y="258" width="740" height="56" />
  <text x="36" y="284" class="body">Not blame — measurement. It says your prose admitted a second reading,</text>
  <text x="36" y="304" class="body">and the vector tells you which claim was the ambiguous one.</text>
</svg>
