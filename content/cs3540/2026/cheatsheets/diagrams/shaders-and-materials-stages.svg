<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #fcd34d; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">Once per vertex, then once per pixel — the cost difference is enormous</text>

  <rect class="node" x="20" y="52" width="220" height="110" />
  <text x="130" y="76" text-anchor="middle" class="label">VERTEX SHADER</text>
  <text x="130" y="98" text-anchor="middle" class="body">runs once per vertex</text>
  <text x="130" y="118" text-anchor="middle" class="mute">a cube: 24 times</text>
  <text x="130" y="140" text-anchor="middle" class="code">out: gl_Position</text>

  <rect class="good" x="290" y="52" width="220" height="110" />
  <text x="400" y="76" text-anchor="middle" class="label">RASTERIZER</text>
  <text x="400" y="98" text-anchor="middle" class="body">fills triangles with pixels</text>
  <text x="400" y="118" text-anchor="middle" class="mute">interpolates every varying</text>
  <text x="400" y="140" text-anchor="middle" class="mute">between the vertices</text>

  <rect class="node" x="560" y="52" width="200" height="110" />
  <text x="660" y="76" text-anchor="middle" class="label">FRAGMENT SHADER</text>
  <text x="660" y="98" text-anchor="middle" class="body">runs once per pixel</text>
  <text x="660" y="118" text-anchor="middle" class="mute">fullscreen: ~2,000,000</text>
  <text x="660" y="140" text-anchor="middle" class="code">out: colour</text>

  <path d="M 244 107 L 286 107" class="arrow" />
  <path d="M 514 107 L 556 107" class="arrow" />

  <rect class="panel" x="20" y="186" width="740" height="86" />
  <text x="36" y="210" class="h">Where to put work</text>
  <text x="36" y="236" class="body">Anything that can be computed per vertex and interpolated should be. A calculation moved from the</text>
  <text x="36" y="254" class="body">fragment shader to the vertex shader on a cube runs 24 times instead of two million.</text>

  <rect class="panel" x="20" y="286" width="740" height="70" />
  <text x="36" y="310" class="h">Lambert diffuse — the whole of basic lighting</text>
  <text x="36" y="336" class="code">float ndotl = max(dot(normalize(vNormal), lightDir), 0.0);  colour = albedo * (ambient + ndotl);</text>
</svg>
