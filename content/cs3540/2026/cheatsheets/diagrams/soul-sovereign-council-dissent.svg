<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="288" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">A log that records only winners</text>
  <rect class="panel" x="20" y="42" width="360" height="178" />
  <text x="36" y="68" class="h" font-size="12">Decision only</text>
  <rect class="warn" x="36" y="84" width="328" height="40" />
  <text x="200" y="109" class="label" text-anchor="middle" font-size="12">“Adopted: option B.”</text>
  <text x="36" y="148" class="body">Six months later nobody can say</text>
  <text x="36" y="168" class="body">why A was rejected. So somebody</text>
  <text x="36" y="188" class="body">proposes A again, and the whole</text>
  <text x="36" y="208" class="body">argument runs a second time.</text>
  <rect class="panel" x="400" y="42" width="360" height="178" />
  <text x="416" y="68" class="h" font-size="12">Decision plus dissent</text>
  <rect class="good" x="416" y="84" width="328" height="40" />
  <text x="580" y="109" class="label" text-anchor="middle" font-size="11">“Adopted B. A rejected because…”</text>
  <text x="416" y="148" class="body">The objection is on the record,</text>
  <text x="416" y="168" class="body">with its reasoning. When the</text>
  <text x="416" y="188" class="body">constraint that killed A changes,</text>
  <text x="416" y="208" class="body">you can see that it has.</text>
  <rect class="panel" x="20" y="234" width="740" height="42" />
  <text x="36" y="262" class="label">Today's minority opinion may be tomorrow's governing principle. Keep it where it can be found.</text>
</svg>
