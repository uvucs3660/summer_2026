<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="300" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Transparency needs all three. Miss one and it looks broken.</text>
  <rect class="panel" x="20" y="42" width="740" height="42" />
  <text x="36" y="70" class="label">Opaque geometry needs no sorting — the depth buffer does it for you. Transparency is the exception.</text>
  <rect class="good" x="36" y="98" width="340" height="44" />
  <text x="48" y="125" class="body" font-size="11">1 · drawn after all opaque geometry</text>
  <path class="warrow" d="M 384 120 L 408 120" />
  <rect class="bad" x="416" y="98" width="328" height="44" />
  <text x="428" y="125" class="body" font-size="10">glass vanishes behind things it is in front of</text>
  <rect class="good" x="36" y="156" width="340" height="44" />
  <text x="48" y="183" class="body" font-size="11">2 · sorted back to front</text>
  <path class="warrow" d="M 384 178 L 408 178" />
  <rect class="bad" x="416" y="156" width="328" height="44" />
  <text x="428" y="183" class="body" font-size="10">the far pane draws over the near one</text>
  <rect class="good" x="36" y="214" width="340" height="44" />
  <text x="48" y="241" class="body" font-size="11">3 · depth writes OFF, depth test ON</text>
  <path class="warrow" d="M 384 236 L 408 236" />
  <rect class="bad" x="416" y="214" width="328" height="44" />
  <text x="428" y="241" class="body" font-size="10">glass occludes glass — this is where the day goes</text>
  <text x="36" y="288" class="h" font-size="12">All three, every time. Two out of three looks like a rendering bug and is a state bug.</text>
</svg>
