<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="306" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">One test decides every line</text>
  <rect class="panel" x="20" y="42" width="740" height="46" />
  <text x="390" y="71" class="label" text-anchor="middle">Would a competent engineer who has never seen this repo actually get this wrong?</text>
  <path class="warrow" d="M 250 90 L 200 118" />
  <path class="arrow" d="M 530 90 L 580 118" />
  <rect class="panel" x="20" y="124" width="360" height="150" />
  <text x="36" y="150" class="h" font-size="13">No — delete it</text>
  <text x="36" y="176" class="body">“This project uses TypeScript.”</text>
  <text x="36" y="198" class="body">“Run npm test to run the tests.”</text>
  <text x="36" y="220" class="body">“src/ holds the source code.”</text>
  <text x="36" y="248" class="mute">You are describing the obvious. Effort</text>
  <text x="36" y="264" class="mute">already spent is not a reason to keep it.</text>
  <rect class="panel" x="400" y="124" width="360" height="150" />
  <text x="416" y="150" class="h" font-size="13">Yes — keep it, and say why</text>
  <text x="416" y="176" class="body">“Tests need DATABASE_URL pointed</text>
  <text x="416" y="198" class="body">at the test DB, or they run against</text>
  <text x="416" y="220" class="body">dev and wipe it.”</text>
  <text x="416" y="248" class="mute">Severe, invisible, and it already carries</text>
  <text x="416" y="264" class="mute">its own reason.</text>
  <text x="20" y="296" class="mute">Applied honestly, this deletes most of what /init generates.</text>
</svg>
