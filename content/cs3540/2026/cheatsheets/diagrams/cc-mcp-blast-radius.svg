<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 370" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="370" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">One protocol, many systems — and each one runs with your privileges</text>

  <rect class="node" x="40" y="70" width="170" height="70" />
  <text x="125" y="94" text-anchor="middle" class="label">Claude Code</text>
  <text x="125" y="116" text-anchor="middle" class="mute">the host</text>

  <rect class="good" x="330" y="52" width="180" height="46" />
  <text x="420" y="72" text-anchor="middle" class="label">github</text>
  <text x="420" y="89" text-anchor="middle" class="mute">issues, PRs</text>

  <rect class="good" x="330" y="110" width="180" height="46" />
  <text x="420" y="130" text-anchor="middle" class="label">postgres</text>
  <text x="420" y="147" text-anchor="middle" class="mute">read-only, dev data</text>

  <rect class="good" x="330" y="168" width="180" height="46" />
  <text x="420" y="188" text-anchor="middle" class="label">playwright</text>
  <text x="420" y="205" text-anchor="middle" class="mute">drives a browser</text>

  <path d="M 214 95  L 326 75" class="arrow" />
  <path d="M 214 105 L 326 133" class="arrow" />
  <path d="M 214 118 L 326 191" class="arrow" />

  <rect class="panel" x="550" y="52" width="200" height="162" />
  <text x="566" y="76" class="h">Two kinds of thing</text>
  <text x="566" y="102" class="label">tools</text>
  <text x="566" y="120" class="mute">do things — side effects</text>
  <text x="566" y="148" class="label">resources</text>
  <text x="566" y="166" class="mute">read things — no side effects</text>
  <text x="566" y="196" class="mute">stdio is your default transport</text>

  <rect class="warn" x="20" y="234" width="740" height="122" />
  <text x="36" y="258" class="label">An MCP server runs with YOUR privileges. Its tool list is its blast radius.</text>
  <text x="36" y="284" class="body">Read the tool list before you install. A server offering <tspan class="code">execute_sql</tspan> can drop a table; one offering</text>
  <text x="36" y="302" class="body"><tspan class="code">query_readonly</tspan> cannot. That difference is the whole of your security posture for that integration.</text>
  <text x="36" y="330" class="body">Project <tspan class="code">.mcp.json</tspan> is committed — so <tspan class="label">${ENV_VAR} for every secret</tspan>, never the literal token.</text>
  <text x="36" y="350" class="mute">Verify with /mcp. If a server is not listed as connected, Claude cannot use it — and will not tell you.</text>
</svg>
