<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 322" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="322" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Quantize before you hash — and name the rounding mode</text>
  <rect class="panel" x="20" y="42" width="740" height="96" />
  <text x="36" y="68" class="h" font-size="13">Raw floats do not agree across languages, so hash integers instead</text>
  <rect class="node" x="40" y="84" width="150" height="40" />
  <text x="115" y="102" class="label" text-anchor="middle" font-size="11">position</text>
  <text x="115" y="118" class="code" text-anchor="middle">-0.0005</text>
  <path class="arrow" d="M 194 104 L 216 104" />
  <rect class="node" x="222" y="84" width="150" height="40" />
  <text x="297" y="102" class="label" text-anchor="middle" font-size="11">x 1000</text>
  <text x="297" y="118" class="code" text-anchor="middle">-0.5</text>
  <path class="arrow" d="M 376 104 L 398 104" />
  <rect class="warn" x="404" y="84" width="150" height="40" />
  <text x="479" y="102" class="label" text-anchor="middle" font-size="11">round</text>
  <text x="479" y="118" class="code" text-anchor="middle">?</text>
  <path class="arrow" d="M 558 104 L 580 104" />
  <rect class="warn" x="586" y="84" width="150" height="40" />
  <text x="661" y="102" class="label" text-anchor="middle" font-size="11">hash</text>
  <text x="661" y="118" class="code" text-anchor="middle">...</text>
  <rect class="panel" x="20" y="150" width="360" height="126" />
  <text x="36" y="176" class="h" font-size="13">JavaScript</text>
  <text x="36" y="200" class="code">Math.round(-0.5)</text>
  <rect class="bad" x="36" y="212" width="328" height="36" />
  <text x="200" y="236" class="code" text-anchor="middle" font-size="14">-0</text>
  <text x="36" y="266" class="mute">rounds half up, toward positive infinity</text>
  <rect class="panel" x="400" y="150" width="360" height="126" />
  <text x="416" y="176" class="h" font-size="13">Dart</text>
  <text x="416" y="200" class="code">(-0.5).round()</text>
  <rect class="bad" x="416" y="212" width="328" height="36" />
  <text x="580" y="236" class="code" text-anchor="middle" font-size="14">-1</text>
  <text x="416" y="266" class="mute">rounds half away from zero</text>
  <rect class="panel" x="20" y="288" width="740" height="30" />
  <text x="36" y="308" class="label" font-size="11">They agree on every positive number — invisible in single player, fatal the first time something crosses an axis.</text>
</svg>
