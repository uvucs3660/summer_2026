<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="300" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Derive the seed. Never draw from one global generator.</text>
  <rect class="panel" x="20" y="42" width="360" height="190" />
  <text x="36" y="68" class="h" font-size="12">One global generator</text>
  <rect class="bad" x="36" y="84" width="328" height="34" />
  <text x="200" y="105" class="label" text-anchor="middle" font-size="11">rng.next() per chunk, as visited</text>
  <text x="36" y="146" class="body">Output depends on the ORDER</text>
  <text x="36" y="166" class="body">chunks were visited.</text>
  <text x="36" y="186" class="body">Visit order differs per machine —</text>
  <text x="36" y="206" class="body">so the world differs per machine.</text>
  <rect class="panel" x="400" y="42" width="360" height="190" />
  <text x="416" y="68" class="h" font-size="12">Derived per chunk</text>
  <rect class="good" x="416" y="84" width="328" height="34" />
  <text x="580" y="105" class="code" text-anchor="middle" font-size="12">hash(worldSeed, cx, cy)</text>
  <text x="416" y="146" class="body">Each chunk's seed is a pure</text>
  <text x="416" y="166" class="body">function of where it is.</text>
  <text x="416" y="186" class="body">Visit them in any order, in any</text>
  <text x="416" y="206" class="body">sequence, on any machine.</text>
  <rect class="panel" x="20" y="246" width="740" height="42" />
  <text x="36" y="274" class="label" font-size="11">This is the week your seeded generator earns its keep — and a desync waiting to happen if you skip it.</text>
</svg>
