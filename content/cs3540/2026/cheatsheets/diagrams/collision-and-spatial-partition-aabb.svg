<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="292" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Do touching edges overlap? You must say.</text>
  <rect class="panel" x="20" y="42" width="360" height="178" />
  <text x="36" y="68" class="h" font-size="12">Strict — a.max &lt; b.min</text>
  <rect class="node" x="60" y="92" width="130" height="60" />
  <text x="125" y="127" class="label" text-anchor="middle" font-size="13">A</text>
  <rect class="node" x="190" y="92" width="130" height="60" />
  <text x="255" y="127" class="label" text-anchor="middle" font-size="13">B</text>
  <text x="190" y="172" class="mute" text-anchor="middle">edges exactly equal</text>
  <rect class="warn" x="36" y="182" width="328" height="26" />
  <text x="200" y="199" class="label" text-anchor="middle" font-size="11">not overlapping</text>
  <rect class="panel" x="400" y="42" width="360" height="178" />
  <text x="416" y="68" class="h" font-size="12">Non-strict — a.max &lt;= b.min</text>
  <rect class="node" x="440" y="92" width="130" height="60" />
  <text x="505" y="127" class="label" text-anchor="middle" font-size="13">A</text>
  <rect class="node" x="570" y="92" width="130" height="60" />
  <text x="635" y="127" class="label" text-anchor="middle" font-size="13">B</text>
  <text x="570" y="172" class="mute" text-anchor="middle">edges exactly equal</text>
  <rect class="good" x="416" y="182" width="328" height="26" />
  <text x="580" y="199" class="label" text-anchor="middle" font-size="11">overlapping</text>
  <rect class="panel" x="20" y="234" width="740" height="46" />
  <text x="36" y="262" class="label">Equally defensible. Four comparisons, one undocumented choice — and two builds will differ on it.</text>
</svg>
