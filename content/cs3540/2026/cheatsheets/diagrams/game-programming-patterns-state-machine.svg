<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="288" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">A pile of booleans can encode nonsense. A state machine cannot.</text>
  <rect class="panel" x="20" y="42" width="360" height="230" />
  <text x="36" y="68" class="h" font-size="13">Three booleans</text>
  <text x="36" y="92" class="code">isJumping · isDead · isAttacking</text>
  <text x="36" y="116" class="body" font-size="11">8 representable combinations:</text>
  <rect class="good" x="36" y="128" width="328" height="24" />
  <text x="48" y="144" class="body" font-size="10">jumping, attacking</text>
  <rect class="good" x="36" y="156" width="328" height="24" />
  <text x="48" y="172" class="body" font-size="10">dead, nothing else</text>
  <rect class="bad" x="36" y="184" width="328" height="24" />
  <text x="48" y="200" class="body" font-size="10">dead AND jumping</text>
  <rect class="bad" x="36" y="212" width="328" height="24" />
  <text x="48" y="228" class="body" font-size="10">all three at once</text>
  <text x="36" y="256" class="mute">Illegal states are undocumented, not impossible.</text>
  <rect class="panel" x="400" y="42" width="360" height="230" />
  <text x="416" y="68" class="h" font-size="13">One state machine</text>
  <rect class="good" x="416" y="92" width="150" height="30" />
  <text x="491" y="112" class="label" text-anchor="middle" font-size="11">Idle</text>
  <rect class="good" x="594" y="92" width="150" height="30" />
  <text x="669" y="112" class="label" text-anchor="middle" font-size="11">Jumping</text>
  <rect class="good" x="416" y="154" width="150" height="30" />
  <text x="491" y="174" class="label" text-anchor="middle" font-size="11">Attacking</text>
  <rect class="good" x="594" y="154" width="150" height="30" />
  <text x="669" y="174" class="label" text-anchor="middle" font-size="11">Dead</text>
  <path class="arrow" d="M 570 107 L 590 107" />
  <path class="arrow" d="M 491 126 L 491 150" />
  <path class="arrow" d="M 669 126 L 669 150" />
  <path class="arrow" d="M 570 169 L 590 169" />
  <text x="416" y="210" class="body" font-size="11">Four states. Four legal transitions.</text>
  <text x="416" y="232" class="body" font-size="11">“dead and jumping” has nowhere to live.</text>
  <text x="416" y="256" class="mute">Illegal states stop being representable.</text>
</svg>
