<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 306" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="306" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Smarter is not better</text>
  <rect class="panel" x="20" y="42" width="360" height="190" />
  <text x="36" y="68" class="h" font-size="12">The optimal opponent</text>
  <rect class="bad" x="36" y="84" width="328" height="40" />
  <text x="200" y="108" class="label" text-anchor="middle" font-size="11">always picks the best move</text>
  <text x="36" y="148" class="body">The player cannot find a pattern,</text>
  <text x="36" y="168" class="body">because there is no pattern —</text>
  <text x="36" y="188" class="body">only correctness.</text>
  <text x="36" y="208" class="body">Losing feels like noise.</text>
  <rect class="panel" x="400" y="42" width="360" height="190" />
  <text x="416" y="68" class="h" font-size="12">The legible opponent</text>
  <rect class="good" x="416" y="84" width="328" height="40" />
  <text x="580" y="108" class="label" text-anchor="middle" font-size="11">has a pattern you can learn</text>
  <text x="416" y="148" class="body">Sight radius. Reaction delay.</text>
  <text x="416" y="168" class="body">A wind-up before anything</text>
  <text x="416" y="188" class="body">dangerous.</text>
  <text x="416" y="208" class="body">Losing feels like a lesson.</text>
  <rect class="panel" x="20" y="250" width="740" height="44" />
  <text x="36" y="278" class="label">“Our AI is too dumb” almost always means “our AI is not readable.” Koster, applied to enemies.</text>
</svg>
