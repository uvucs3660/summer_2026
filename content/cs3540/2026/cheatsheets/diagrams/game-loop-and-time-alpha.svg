<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 276" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .track { stroke: #4b5563; stroke-width: 2; }
    .gap   { stroke: #6b7280; stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="276" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="24" class="h" font-size="15">The leftover time is what makes 20Hz look smooth</text>

  <rect class="panel" x="20" y="42" width="740" height="158" />

  <line class="track" x1="120" y1="118" x2="660" y2="118" />

  <!-- the two simulation states the renderer sits between -->
  <circle cx="120" cy="118" r="11" fill="#1f2937" stroke="#60a5fa" stroke-width="1.8" />
  <text x="120" y="152" text-anchor="middle" class="body">tick N</text>
  <text x="120" y="170" text-anchor="middle" class="mute">state you have</text>

  <circle cx="660" cy="118" r="11" fill="#1f2937" stroke="#60a5fa" stroke-width="1.8" />
  <text x="660" y="152" text-anchor="middle" class="body">tick N+1</text>
  <text x="660" y="170" text-anchor="middle" class="mute">state you have</text>

  <!-- the drawn position, which exists in no simulation state at all -->
  <line class="gap" x1="444" y1="80" x2="444" y2="146" />
  <circle cx="444" cy="118" r="9" fill="#064e3b" stroke="#34d399" stroke-width="2" />
  <text x="444" y="72" text-anchor="middle" class="label" font-size="12">what you draw</text>
  <text x="444" y="170" text-anchor="middle" class="mute">exists in no simulation state</text>

  <text x="424" y="100" text-anchor="end" class="code">alpha = 0.6</text>

  <rect class="panel" x="20" y="212" width="740" height="52" />
  <text x="36" y="236" class="body"><tspan class="code">alpha = accumulator / STEP</tspan> — how far you are between two ticks, always between 0 and 1.</text>
  <text x="36" y="256" class="label">It travels one direction only: into the renderer, never back into <tspan class="code">tick()</tspan>.</text>
</svg>
