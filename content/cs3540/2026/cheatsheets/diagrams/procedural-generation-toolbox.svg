<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="400" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">Four generators, four shapes of output</text>

  <rect class="good" x="20" y="46" width="175" height="120" />
  <text x="107" y="70" text-anchor="middle" class="label">Value / gradient noise</text>
  <text x="107" y="94" text-anchor="middle" class="body">smooth, continuous</text>
  <text x="107" y="114" text-anchor="middle" class="mute">terrain height, clouds,</text>
  <text x="107" y="130" text-anchor="middle" class="mute">wood grain, wind</text>
  <text x="107" y="154" text-anchor="middle" class="code">f(x, y) → [0,1]</text>

  <rect class="good" x="215" y="46" width="175" height="120" />
  <text x="302" y="70" text-anchor="middle" class="label">Cellular automata</text>
  <text x="302" y="94" text-anchor="middle" class="body">organic blobs</text>
  <text x="302" y="114" text-anchor="middle" class="mute">caves, islands,</text>
  <text x="302" y="130" text-anchor="middle" class="mute">erosion</text>
  <text x="302" y="154" text-anchor="middle" class="code">smooth n times</text>

  <rect class="node" x="410" y="46" width="175" height="120" />
  <text x="497" y="70" text-anchor="middle" class="label">L-systems</text>
  <text x="497" y="94" text-anchor="middle" class="body">branching structures</text>
  <text x="497" y="114" text-anchor="middle" class="mute">trees, rivers, roads,</text>
  <text x="497" y="130" text-anchor="middle" class="mute">lightning</text>
  <text x="497" y="154" text-anchor="middle" class="code">rewrite rules</text>

  <rect class="node" x="605" y="46" width="155" height="120" />
  <text x="682" y="70" text-anchor="middle" class="label">Wave function</text>
  <text x="682" y="86" text-anchor="middle" class="label">collapse</text>
  <text x="682" y="110" text-anchor="middle" class="body">tiles that fit</text>
  <text x="682" y="130" text-anchor="middle" class="mute">dungeons, towns</text>
  <text x="682" y="154" text-anchor="middle" class="code">constraint solve</text>

  <rect class="warn" x="20" y="190" width="740" height="96" />
  <text x="36" y="212" class="label">Infinite content gets boring faster than authored content</text>
  <text x="36" y="236" class="body">A generator produces variation, not novelty. Once the player has learned the generator's pattern,</text>
  <text x="36" y="254" class="body">every new instance is the same experience with different numbers — which is exactly Koster's</text>
  <text x="36" y="272" class="body">boredom case, arriving faster because the pattern is smaller than a designer's.</text>

  <rect class="panel" x="20" y="300" width="740" height="86" />
  <text x="36" y="324" class="h">Generate from the seed, never from the clock</text>
  <text x="36" y="350" class="code">const rng = mulberry32(worldSeed ^ chunkX * 73856093 ^ chunkY * 19349663);</text>
  <text x="36" y="376" class="mute">Same seed, same chunk, same result — whether generated now, on reload, or on a peer's machine.</text>
</svg>
