<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 312" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="312" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Each layer does a job the one above it cannot</text>
  <rect class="panel" x="20" y="42" width="740" height="250" />
  <rect class="good" x="36" y="62" width="190" height="36" />
  <text x="131" y="85" class="label" text-anchor="middle" font-size="11">soul</text>
  <text x="240" y="78" class="body" font-size="11">makes it want to behave</text>
  <text x="240" y="94" class="mute">generalises to cases you never imagined</text>
  <rect class="good" x="36" y="108" width="190" height="36" />
  <text x="131" y="131" class="label" text-anchor="middle" font-size="11">permission modes</text>
  <text x="240" y="124" class="body" font-size="11">asks before acting</text>
  <text x="240" y="140" class="mute">a human in the loop, while there is one</text>
  <rect class="warn" x="36" y="154" width="190" height="36" />
  <text x="131" y="177" class="label" text-anchor="middle" font-size="11">hooks</text>
  <text x="240" y="170" class="body" font-size="11">makes misbehaviour impossible</text>
  <text x="240" y="186" class="mute">deterministic — exit 2 and it does not happen</text>
  <rect class="warn" x="36" y="200" width="190" height="36" />
  <text x="131" y="223" class="label" text-anchor="middle" font-size="11">least privilege</text>
  <text x="240" y="216" class="body" font-size="11">makes the residue survivable</text>
  <text x="240" y="232" class="mute">what it cannot reach, it cannot break</text>
  <rect class="bad" x="36" y="246" width="190" height="36" />
  <text x="131" y="269" class="label" text-anchor="middle" font-size="11">audit trail</text>
  <text x="240" y="262" class="body" font-size="11">makes it explainable</text>
  <text x="240" y="278" class="mute">the only layer that works after the fact</text>
  <text x="36" y="304" class="h" font-size="12">No single layer is sufficient. That is not redundancy — each covers a different failure.</text>
</svg>
