<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .cell  { fill: none; stroke: #374151; stroke-width: 1; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.3; rx: 4; ry: 4; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.4; rx: 6; ry: 6; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 6; ry: 6; }
    .hit   { fill: #1e3a8a; stroke: #60a5fa; stroke-width: 1.5; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
  </style>

  <text x="20" y="26" class="h" font-size="15">Broadphase throws away pairs. Narrowphase checks what survives.</text>

  <rect class="panel" x="20" y="44" width="300" height="230" />
  <text x="36" y="66" class="h">Uniform grid</text>
  <g>
    <rect class="cell" x="40" y="80" width="60" height="60" /><rect class="cell" x="100" y="80" width="60" height="60" />
    <rect class="cell" x="160" y="80" width="60" height="60" /><rect class="cell" x="220" y="80" width="60" height="60" />
    <rect class="cell" x="40" y="140" width="60" height="60" /><rect class="hit" x="100" y="140" width="60" height="60" />
    <rect class="cell" x="160" y="140" width="60" height="60" /><rect class="cell" x="220" y="140" width="60" height="60" />
    <rect class="cell" x="40" y="200" width="60" height="60" /><rect class="cell" x="100" y="200" width="60" height="60" />
    <rect class="cell" x="160" y="200" width="60" height="60" /><rect class="cell" x="220" y="200" width="60" height="60" />
  </g>
  <circle cx="118" cy="160" r="7" fill="#34d399" />
  <circle cx="142" cy="182" r="7" fill="#34d399" />
  <circle cx="250" cy="110" r="7" fill="#9ca3af" />
  <circle cx="62"  cy="232" r="7" fill="#9ca3af" />
  <text x="36" y="288" class="mute">Only bodies sharing a cell are candidates.</text>

  <rect class="panel" x="340" y="44" width="420" height="230" />
  <text x="356" y="66" class="h">Why O(n²) is not "optimize later"</text>
  <text x="356" y="94"  class="code">     100 bodies  →      4,950 pairs   fine</text>
  <text x="356" y="116" class="code">   1,000 bodies  →    499,500 pairs   sluggish</text>
  <text x="356" y="138" class="code">   5,000 bodies  → 12,497,500 pairs   dead</text>
  <text x="356" y="170" class="body">The class perf budget is 5,000 bodies at 60fps.</text>
  <text x="356" y="188" class="body">A naive loop passes every correctness test and</text>
  <text x="356" y="206" class="body">fails that budget — which is the point of having one.</text>
  <text x="356" y="236" class="mute">A grid turns 12 million checks into a few thousand,</text>
  <text x="356" y="251" class="mute">because most pairs are never in the same cell.</text>

  <rect class="panel" x="20" y="292" width="740" height="82" />
  <text x="36" y="316" class="h">AABB overlap — the whole narrowphase for boxes</text>
  <text x="36" y="342" class="code">overlap = a.minX &lt; b.maxX &amp;&amp; a.maxX &gt; b.minX &amp;&amp; a.minY &lt; b.maxY &amp;&amp; a.maxY &gt; b.minY</text>
  <text x="36" y="366" class="mute">Strict inequalities: touching edges do not count as overlapping. Say which you mean in the spec.</text>
</svg>
