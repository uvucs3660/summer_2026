<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="366" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Five shapes, each defined by what it must not do</text>
  <rect class="panel" x="20" y="42" width="740" height="288" />
  <text x="36" y="66" class="h" font-size="11">archetype</text>
  <text x="180" y="66" class="h" font-size="11">mission</text>
  <text x="470" y="66" class="h" font-size="11">anti-goals — the half that does the work</text>
  <rect class="node" x="36" y="78" width="130" height="36" />
  <text x="101" y="101" class="label" text-anchor="middle" font-size="11">Prototyper</text>
  <text x="180" y="101" class="body" font-size="10.5">maximise learning per hour</text>
  <rect class="warn" x="462" y="78" width="282" height="36" />
  <text x="474" y="101" class="body" font-size="10">never extend past the question</text>
  <rect class="node" x="36" y="122" width="130" height="36" />
  <text x="101" y="145" class="label" text-anchor="middle" font-size="11">Builder</text>
  <text x="180" y="145" class="body" font-size="10.5">“works on my machine” → production</text>
  <rect class="warn" x="462" y="122" width="282" height="36" />
  <text x="474" y="145" class="body" font-size="10">no gold-plating, never ship untested</text>
  <rect class="node" x="36" y="166" width="130" height="36" />
  <text x="101" y="189" class="label" text-anchor="middle" font-size="11">Sweeper</text>
  <text x="180" y="189" class="body" font-size="10.5">reduce complexity, preserve behaviour</text>
  <rect class="warn" x="462" y="166" width="282" height="36" />
  <text x="474" y="189" class="body" font-size="10">no features mid-sweep</text>
  <rect class="node" x="36" y="210" width="130" height="36" />
  <text x="101" y="233" class="label" text-anchor="middle" font-size="11">Grower</text>
  <text x="180" y="233" class="body" font-size="10.5">move activation and retention</text>
  <rect class="warn" x="462" y="210" width="282" height="36" />
  <text x="474" y="233" class="body" font-size="10">output is metric movement, not PRs</text>
  <rect class="node" x="36" y="254" width="130" height="36" />
  <text x="101" y="277" class="label" text-anchor="middle" font-size="11">Maintainer</text>
  <text x="180" y="277" class="body" font-size="10.5">availability, integrity, confidentiality</text>
  <rect class="warn" x="462" y="254" width="282" height="36" />
  <text x="474" y="277" class="body" font-size="10">do not become the department of no</text>
  <text x="36" y="302" class="mute">Brainstorm is Prototyper work. Spec and Plan are Builder work</text>
  <text x="36" y="318" class="mute">with Maintainer review. Execute is Builder to Sweeper.</text>
</svg>
