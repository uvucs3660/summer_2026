<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="288" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Facts stay. Procedures move.</text>
  <rect class="panel" x="20" y="42" width="360" height="172" />
  <text x="36" y="68" class="h" font-size="13">A fact about the repo</text>
  <text x="36" y="90" class="mute">one line · true on every turn</text>
  <rect class="good" x="36" y="104" width="328" height="34" />
  <text x="48" y="125" class="body" font-size="11">Releases bump version in two places.</text>
  <rect class="good" x="36" y="146" width="328" height="34" />
  <text x="48" y="167" class="body" font-size="10">Spec sections are S04–S18, owned in OWNERS.md.</text>
  <text x="36" y="200" class="mute">goes in CLAUDE.md — cheap, always relevant</text>
  <rect class="panel" x="400" y="42" width="360" height="172" />
  <text x="416" y="68" class="h" font-size="13">A procedure</text>
  <text x="416" y="90" class="mute">fifteen+ lines · relevant ~2% of turns</text>
  <rect class="warn" x="416" y="104" width="328" height="34" />
  <text x="428" y="125" class="body" font-size="11">How we cut a release.</text>
  <rect class="warn" x="416" y="146" width="328" height="34" />
  <text x="428" y="167" class="body" font-size="11">How to add a new spec section.</text>
  <text x="416" y="200" class="mute">goes in a skill — loads only when it matches</text>
  <rect class="panel" x="20" y="226" width="740" height="46" />
  <text x="36" y="254" class="label">If a CLAUDE.md entry runs past three or four lines, that is the signal it wants to be a skill.</text>
</svg>
