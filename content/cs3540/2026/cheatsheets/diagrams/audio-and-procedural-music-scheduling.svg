<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="296" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Schedule ahead. Never trigger on a frame.</text>
  <rect class="panel" x="20" y="42" width="360" height="186" />
  <text x="36" y="68" class="h" font-size="12">setTimeout / on a frame</text>
  <rect class="bad" x="36" y="84" width="328" height="36" />
  <text x="200" y="107" class="label" text-anchor="middle" font-size="11">jitters by tens of milliseconds</text>
  <text x="36" y="148" class="body">The main thread is busy, so the</text>
  <text x="36" y="168" class="body">callback is late — by a variable</text>
  <text x="36" y="188" class="body">amount. Tens of ms is audible,</text>
  <text x="36" y="208" class="body">and it is audible as sloppiness.</text>
  <rect class="panel" x="400" y="42" width="360" height="186" />
  <text x="416" y="68" class="h" font-size="12">WebAudio, given a time</text>
  <rect class="good" x="416" y="84" width="328" height="36" />
  <text x="580" y="107" class="code" text-anchor="middle" font-size="11">source.start(ctx.currentTime + 0.5)</text>
  <text x="416" y="148" class="body">A sample-accurate clock running</text>
  <text x="416" y="168" class="body">off the audio thread. Hand it a</text>
  <text x="416" y="188" class="body">time and it hits that time,</text>
  <text x="416" y="208" class="body">whatever the main thread is doing.</text>
  <rect class="panel" x="20" y="242" width="740" height="42" />
  <text x="36" y="270" class="label" font-size="11">And the context starts suspended — silent audio that “works on my machine” is almost always this.</text>
</svg>
