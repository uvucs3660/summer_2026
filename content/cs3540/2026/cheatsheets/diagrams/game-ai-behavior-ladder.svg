<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .arrow { stroke: #fcd34d; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="380" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">Climb only when the rung you are on actually breaks</text>

  <rect class="good" x="20" y="48" width="175" height="100" />
  <text x="107" y="72" text-anchor="middle" class="label">1 · Steering</text>
  <text x="107" y="94" text-anchor="middle" class="body">seek, flee, separate</text>
  <text x="107" y="114" text-anchor="middle" class="mute">a few lines of vector math</text>
  <text x="107" y="134" text-anchor="middle" class="mute">flocks, swarms, crowds</text>

  <rect class="good" x="215" y="48" width="175" height="100" />
  <text x="302" y="72" text-anchor="middle" class="label">2 · State machine</text>
  <text x="302" y="94" text-anchor="middle" class="body">idle → chase → attack</text>
  <text x="302" y="114" text-anchor="middle" class="mute">readable, debuggable</text>
  <text x="302" y="134" text-anchor="middle" class="mute">most enemies, forever</text>

  <rect class="node" x="410" y="48" width="175" height="100" />
  <text x="497" y="72" text-anchor="middle" class="label">3 · Behavior tree</text>
  <text x="497" y="94" text-anchor="middle" class="body">selectors + sequences</text>
  <text x="497" y="114" text-anchor="middle" class="mute">composable, reusable</text>
  <text x="497" y="134" text-anchor="middle" class="mute">when the FSM has 12 states</text>

  <rect class="node" x="605" y="48" width="155" height="100" />
  <text x="682" y="72" text-anchor="middle" class="label">4 · Utility</text>
  <text x="682" y="94" text-anchor="middle" class="body">score every option</text>
  <text x="682" y="114" text-anchor="middle" class="mute">pick the best</text>
  <text x="682" y="134" text-anchor="middle" class="mute">strategy AI, economies</text>

  <path d="M 199 98 L 211 98" class="arrow" />
  <path d="M 394 98 L 406 98" class="arrow" />
  <path d="M 589 98 L 601 98" class="arrow" />

  <rect class="warn" x="20" y="170" width="740" height="94" />
  <text x="36" y="192" class="label">The trap: smarter is not better</text>
  <text x="36" y="216" class="body">An opponent that plays optimally is not more fun — it is more frustrating, and usually less readable.</text>
  <text x="36" y="234" class="body">Players enjoy an enemy whose pattern they can learn and then beat. That is Koster's argument applied</text>
  <text x="36" y="252" class="body">to AI: the goal is a legible pattern, not a strong one.</text>

  <rect class="panel" x="20" y="280" width="740" height="86" />
  <text x="36" y="304" class="h">Telegraph everything</text>
  <text x="36" y="330" class="body">An attack with no wind-up is noise, not difficulty. Give every dangerous action a visible tell long</text>
  <text x="36" y="348" class="body">enough to react to — then the player losing is their mistake, and beating it is their achievement.</text>
</svg>
