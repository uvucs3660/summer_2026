<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #fcd34d; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#fcd34d" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="390" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">Four matrices turn a vertex in model space into a pixel</text>

  <rect class="node" x="20" y="52" width="130" height="70" />
  <text x="85" y="76" text-anchor="middle" class="label">model space</text>
  <text x="85" y="96" text-anchor="middle" class="mute">the mesh as authored,</text>
  <text x="85" y="112" text-anchor="middle" class="mute">origin at its own centre</text>

  <rect class="node" x="180" y="52" width="130" height="70" />
  <text x="245" y="76" text-anchor="middle" class="label">world space</text>
  <text x="245" y="96" text-anchor="middle" class="mute">placed in the scene</text>
  <text x="245" y="112" text-anchor="middle" class="code">× model</text>

  <rect class="node" x="340" y="52" width="130" height="70" />
  <text x="405" y="76" text-anchor="middle" class="label">view space</text>
  <text x="405" y="96" text-anchor="middle" class="mute">relative to the camera</text>
  <text x="405" y="112" text-anchor="middle" class="code">× view</text>

  <rect class="good" x="500" y="52" width="130" height="70" />
  <text x="565" y="76" text-anchor="middle" class="label">clip space</text>
  <text x="565" y="96" text-anchor="middle" class="mute">perspective applied</text>
  <text x="565" y="112" text-anchor="middle" class="code">× projection</text>

  <rect class="good" x="660" y="52" width="100" height="70" />
  <text x="710" y="76" text-anchor="middle" class="label">screen</text>
  <text x="710" y="98" text-anchor="middle" class="mute">pixels</text>

  <path d="M 154 87 L 176 87" class="arrow" />
  <path d="M 314 87 L 336 87" class="arrow" />
  <path d="M 474 87 L 496 87" class="arrow" />
  <path d="M 634 87 L 656 87" class="arrow" />

  <rect class="panel" x="20" y="146" width="365" height="110" />
  <text x="36" y="170" class="h">In the vertex shader</text>
  <text x="36" y="196" class="code">gl_Position = projection * view</text>
  <text x="36" y="214" class="code">              * model * vec4(pos, 1.0);</text>
  <text x="36" y="242" class="mute">Right to left. The rightmost applies first.</text>

  <rect class="panel" x="400" y="146" width="360" height="110" />
  <text x="416" y="170" class="h">The depth buffer does the sorting</text>
  <text x="416" y="196" class="body">Unlike 2D, you do not sort opaque geometry.</text>
  <text x="416" y="214" class="body">Enable depth test and the GPU keeps the</text>
  <text x="416" y="232" class="body">nearest fragment per pixel.</text>

  <rect class="warn" x="20" y="272" width="740" height="100" />
  <text x="36" y="294" class="label">Transparency is the exception, and it is where everyone loses a day</text>
  <text x="36" y="318" class="body">Transparent surfaces must be drawn AFTER all opaque geometry, sorted back to front, with depth</text>
  <text x="36" y="336" class="body">WRITES off but depth TESTING on. Get any of those three wrong and glass vanishes or occludes wrongly.</text>
  <text x="36" y="360" class="code">gl.depthMask(false)  // test against depth, but do not write to it</text>
</svg>
