<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.3; rx: 5; ry: 5; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.4; rx: 5; ry: 5; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 5; ry: 5; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .grid  { stroke: #374151; stroke-width: 1; }
  </style>

  <text x="20" y="26" class="h" font-size="15">A cutscene is data on a timeline, not a script full of sleeps</text>

  <rect class="panel" x="20" y="44" width="740" height="180" />

  <line x1="140" y1="60" x2="140" y2="205" class="grid" />
  <line x1="290" y1="60" x2="290" y2="205" class="grid" />
  <line x1="440" y1="60" x2="440" y2="205" class="grid" />
  <line x1="590" y1="60" x2="590" y2="205" class="grid" />
  <text x="140" y="76" text-anchor="middle" class="mute">0.0s</text>
  <text x="290" y="76" text-anchor="middle" class="mute">1.5s</text>
  <text x="440" y="76" text-anchor="middle" class="mute">3.0s</text>
  <text x="590" y="76" text-anchor="middle" class="mute">4.5s</text>

  <text x="36" y="106" class="body">camera</text>
  <rect class="good" x="140" y="92" width="300" height="22" />
  <text x="290" y="107" text-anchor="middle" class="mute">pan to gate · easeInOut</text>

  <text x="36" y="140" class="body">dialogue</text>
  <rect class="node" x="290" y="126" width="220" height="22" />
  <text x="400" y="141" text-anchor="middle" class="mute">"the gate is sealed"</text>

  <text x="36" y="174" class="body">audio</text>
  <rect class="node" x="140" y="160" width="120" height="22" />
  <text x="200" y="175" text-anchor="middle" class="mute">wind</text>
  <rect class="node" x="440" y="160" width="150" height="22" />
  <text x="515" y="175" text-anchor="middle" class="mute">stone grinding</text>

  <text x="36" y="200" class="body">gameplay</text>
  <rect class="warn" x="140" y="186" width="520" height="19" />
  <text x="400" y="200" text-anchor="middle" class="mute">input disabled — and re-enabled on skip, too</text>

  <rect class="panel" x="20" y="240" width="365" height="100" />
  <text x="36" y="264" class="h">Seek, do not sleep</text>
  <text x="36" y="290" class="code">update(t) { for (const c of cues)</text>
  <text x="36" y="308" class="code">  if (t &gt;= c.at &amp;&amp; !c.fired) c.fire(); }</text>
  <text x="36" y="332" class="mute">A timeline you can scrub is a timeline you can skip.</text>

  <rect class="panel" x="400" y="240" width="360" height="100" />
  <text x="416" y="264" class="h">Skippable from the first frame</text>
  <text x="416" y="290" class="body">Skip must apply every end-state at once —</text>
  <text x="416" y="308" class="body">camera, flags, input — not just stop playback.</text>
  <text x="416" y="332" class="mute">Half-applied cutscene state is the classic soft-lock.</text>
</svg>
