<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="400" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">The renderer cannot reach the network. Only commands cross.</text>

  <rect class="node" x="20" y="46" width="350" height="120" />
  <text x="36" y="70" class="label">renderer/ — a plain web page</text>
  <text x="36" y="96"  class="body">Chromium context. DOM, Canvas, WebGL.</text>
  <text x="36" y="116" class="body">Your sim and your rendering live here.</text>
  <text x="36" y="144" class="mute">Sandboxed: no sockets, no filesystem, no peers.</text>

  <rect class="good" x="410" y="46" width="350" height="120" />
  <text x="426" y="70" class="label">workers/ — Bare runtime</text>
  <text x="426" y="96"  class="body">Hyperswarm, Hypercore, Autobase.</text>
  <text x="426" y="116" class="body">The only thing that touches the network.</text>
  <text x="426" y="144" class="mute">Node-like, but not the browser.</text>

  <path d="M 374 96 L 406 96" class="arrow" />
  <path d="M 406 116 L 374 116" class="arrow" />
  <text x="390" y="184" text-anchor="middle" class="mute">preload bridge · commands only</text>

  <rect class="panel" x="20" y="200" width="740" height="106" />
  <text x="36" y="224" class="h">The purity rule becomes a process boundary</text>
  <text x="36" y="250" class="body">Every RTS ever shipped had to invent the separation between simulation and network by discipline.</text>
  <text x="36" y="268" class="body">Pear's project layout hands it to you: the renderer literally cannot open a socket, so the only</text>
  <text x="36" y="286" class="body">thing that can cross the bridge is a command. The correct design is the path of least resistance.</text>

  <rect class="panel" x="20" y="322" width="740" height="62" />
  <text x="36" y="346" class="h">Two pieces, two jobs</text>
  <text x="36" y="372" class="body"><tspan class="code">Hyperswarm</tspan> = encrypted duplex stream, the hot path.  <tspan class="code">Hypercore</tspan> = append-only signed log — your command log, and your replay file.</text>
</svg>
