<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="268" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">The axis under all eleven pillars</text>
  <rect class="panel" x="20" y="42" width="360" height="158" />
  <text x="36" y="68" class="h" font-size="13">Always loaded</text>
  <text x="36" y="86" class="mute">every turn, every session, forever</text>
  <text x="36" y="112" class="body">CLAUDE.md — all of it</text>
  <text x="36" y="134" class="body">every skill's description line</text>
  <text x="36" y="156" class="body">your tool definitions</text>
  <text x="36" y="186" class="mute">you pay this on turn 1 and turn 400</text>
  <rect class="panel" x="400" y="42" width="360" height="158" />
  <text x="416" y="68" class="h" font-size="13">Loaded on demand</text>
  <text x="416" y="86" class="mute">only when something matches</text>
  <text x="416" y="112" class="body">a skill's body — if its description hit</text>
  <text x="416" y="134" class="body">a subagent's work — separate context</text>
  <text x="416" y="156" class="body">a file — when it is actually read</text>
  <text x="416" y="186" class="mute">a 20k-token investigation, 200 tokens back</text>
  <rect class="panel" x="20" y="212" width="740" height="46" />
  <text x="36" y="240" class="label">“Where does this belong?” is always “do I need it every turn, or only sometimes?”</text>
</svg>
