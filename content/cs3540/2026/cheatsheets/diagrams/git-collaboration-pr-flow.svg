<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .step  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .main-line { stroke: #34d399; stroke-width: 3; fill: none; }
    .feat-line { stroke: #6b7280; stroke-width: 2; fill: none; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">One repo, twelve authors: branch, PR, review, merge</text>

  <line x1="110" y1="80" x2="740" y2="80" class="main-line" />
  <text x="20" y="84" class="label">main</text>
  <circle cx="140" cy="80" r="6" fill="#34d399" />
  <circle cx="700" cy="80" r="6" fill="#34d399" />

  <path d="M 140 80 Q 175 80, 195 140 L 560 140 Q 610 140, 700 80" class="feat-line" />
  <text x="20" y="145" class="body">you/S09</text>
  <circle cx="250" cy="140" r="5" fill="#60a5fa" />
  <circle cx="330" cy="140" r="5" fill="#60a5fa" />

  <rect class="step" x="195" y="180" width="150" height="48" />
  <text x="270" y="199" text-anchor="middle" class="label">1 · branch</text>
  <text x="270" y="217" text-anchor="middle" class="code">checkout -b you/S09</text>

  <rect class="step" x="365" y="180" width="150" height="48" />
  <text x="440" y="199" text-anchor="middle" class="label">2 · commit</text>
  <text x="440" y="217" text-anchor="middle" class="mute">small, one idea each</text>

  <rect class="step" x="535" y="180" width="150" height="48" />
  <text x="610" y="199" text-anchor="middle" class="label">3 · push</text>
  <text x="610" y="217" text-anchor="middle" class="code">push -u origin</text>

  <rect class="good" x="195" y="252" width="200" height="48" />
  <text x="295" y="271" text-anchor="middle" class="label">4 · open PR</text>
  <text x="295" y="289" text-anchor="middle" class="mute">what changed and why</text>

  <rect class="good" x="415" y="252" width="200" height="48" />
  <text x="515" y="271" text-anchor="middle" class="label">5 · review a peer's</text>
  <text x="515" y="289" text-anchor="middle" class="mute">ask about the ambiguity</text>

  <path d="M 345 204 L 363 204" class="arrow" />
  <path d="M 515 204 L 533 204" class="arrow" />
  <path d="M 395 276 L 413 276" class="arrow" />

  <rect class="warn" x="20" y="320" width="740" height="44" />
  <text x="36" y="339" class="label">Conflict?</text>
  <text x="110" y="339" class="body">Someone edited the same lines. Git is telling you two humans disagreed — not that you broke something.</text>
  <text x="110" y="356" class="code">git fetch origin &amp;&amp; git rebase origin/main &amp;&amp; git add &lt;file&gt; &amp;&amp; git rebase --continue</text>
</svg>
