<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="286" fill="#0b1220" rx="12" ry="12" />

<text x="20" y="24" class="h" font-size="15">The spiral of death is a feedback loop</text>
<rect class="panel" x="20" y="42" width="740" height="176" />
<rect class="node" x="45" y="74" width="150" height="54" />
<text x="120" y="96" text-anchor="middle" class="body">a stalled tab hands</text>
<text x="120" y="114" text-anchor="middle" class="body">you 8,000ms</text>
<rect class="node" x="232" y="74" width="150" height="54" />
<text x="307" y="96" text-anchor="middle" class="body">the while loop runs</text>
<text x="307" y="114" text-anchor="middle" class="body">160 ticks</text>
<rect class="node" x="419" y="74" width="150" height="54" />
<text x="494" y="96" text-anchor="middle" class="body">160 ticks take</text>
<text x="494" y="114" text-anchor="middle" class="body">400ms of real time</text>
<rect class="node" x="606" y="74" width="150" height="54" />
<text x="681" y="96" text-anchor="middle" class="body">so the next frame's</text>
<text x="681" y="114" text-anchor="middle" class="body">dt is bigger still</text>
<path class="arrow" d="M 195 101 L 228 101" />
<path class="arrow" d="M 382 101 L 415 101" />
<path class="arrow" d="M 569 101 L 602 101" />
<path class="arrow" d="M 681 128 L 681 170 L 500 170" />
<path class="arrow" d="M 330 170 L 120 170 L 120 128" />
<rect x="330" y="152" width="170" height="36" fill="#064e3b" stroke="#34d399" stroke-width="1.6" rx="8" />
<text x="415" y="175" text-anchor="middle" class="label" font-size="12">MAX_FRAME clamp</text>
<text x="40" y="206" class="mute">Without the clamp the loop closes on itself and the tab never recovers.</text>
<rect class="panel" x="20" y="230" width="740" height="44" />
<text x="36" y="257" class="label">Dropping simulated time is a decision. Falling permanently behind is a failure.</text>
</svg>