<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 6; ry: 6; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 6; ry: 6; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 6; ry: 6; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .bar   { stroke-width: 0; }
  </style>

  <text x="20" y="26" class="h" font-size="15">You have 16.6ms. The model takes 500–3000ms.</text>

  <rect class="panel" x="20" y="44" width="740" height="106" />
  <text x="36" y="68" class="body">one frame</text>
  <rect class="good" x="130" y="56" width="14" height="20" />
  <text x="152" y="71" class="mute">16.6ms</text>

  <text x="36" y="102" class="body">LLM call</text>
  <rect class="warn" x="130" y="90" width="580" height="20" />
  <text x="424" y="105" text-anchor="middle" class="mute">500–3000ms — roughly 30 to 180 frames</text>

  <text x="36" y="136" class="mute">So: never await in the tick. Fire the request, keep playing, apply the answer when it lands.</text>

  <rect class="panel" x="20" y="166" width="365" height="120" />
  <text x="36" y="190" class="h">Constrain the output</text>
  <text x="36" y="216" class="code">{ "line": "...", "emotion": "wary",</text>
  <text x="36" y="234" class="code">  "action": "flee" }</text>
  <text x="36" y="262" class="body">A 3B model returns this reliably. Free-form</text>
  <text x="36" y="280" class="body">prose from the same model wanders.</text>

  <rect class="panel" x="400" y="166" width="360" height="120" />
  <text x="416" y="190" class="h">Then record it</text>
  <text x="416" y="216" class="code">log.append({ tick, kind: 'npc_line',</text>
  <text x="416" y="234" class="code">             args: { text: reply } })</text>
  <text x="416" y="262" class="body">The model is nondeterministic. The recorded</text>
  <text x="416" y="280" class="body">reply is not. Replay reads the log.</text>

  <rect class="warn" x="20" y="302" width="740" height="62" />
  <text x="36" y="326" class="label">The fallback is graded, not the cloud call</text>
  <text x="36" y="350" class="body">A conformance vector kills every provider and checks the game still runs and says so. Design for that first.</text>
</svg>
