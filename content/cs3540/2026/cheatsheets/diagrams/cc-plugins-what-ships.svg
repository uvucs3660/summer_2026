<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="300" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">A plugin is the other nine pillars, in a box</text>
  <rect class="panel" x="20" y="42" width="740" height="42" />
  <text x="36" y="70" class="label">Everything you built this term, packaged so somebody else gets it in one install.</text>
  <rect class="good" x="36" y="100" width="350" height="46" />
  <text x="48" y="120" class="label" font-size="11">skills</text>
  <text x="48" y="136" class="mute">descriptions + bodies</text>
  <rect class="good" x="402" y="100" width="350" height="46" />
  <text x="414" y="120" class="label" font-size="11">subagents</text>
  <text x="414" y="136" class="mute">with their anti-goals</text>
  <rect class="good" x="36" y="156" width="350" height="46" />
  <text x="48" y="176" class="label" font-size="11">hooks</text>
  <text x="48" y="192" class="mute">the guards, already wired</text>
  <rect class="good" x="402" y="156" width="350" height="46" />
  <text x="414" y="176" class="label" font-size="11">MCP servers</text>
  <text x="414" y="192" class="mute">and their tool lists</text>
  <rect class="good" x="36" y="212" width="350" height="46" />
  <text x="48" y="232" class="label" font-size="11">commands</text>
  <text x="48" y="248" class="mute">the slash commands</text>
  <rect class="good" x="402" y="212" width="350" height="46" />
  <text x="414" y="232" class="label" font-size="11">CLAUDE.md fragments</text>
  <text x="414" y="248" class="mute">facts about this domain</text>
  <text x="36" y="288" class="h" font-size="12">The unit of distribution — and, in a governed setup, the unit a Council ratifies.</text>
</svg>
