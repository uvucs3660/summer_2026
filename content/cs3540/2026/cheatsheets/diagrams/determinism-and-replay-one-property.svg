<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 310" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="310" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Everything technical in this course rests on one property</text>
  <rect class="panel" x="20" y="52" width="268" height="186" />
  <text x="36" y="80" class="h" font-size="13">The property</text>
  <rect class="good" x="36" y="96" width="236" height="74" />
  <text x="154" y="122" class="label" text-anchor="middle" font-size="12">same seed</text>
  <text x="154" y="142" class="label" text-anchor="middle" font-size="12">+ same commands</text>
  <text x="154" y="162" class="label" text-anchor="middle" font-size="12">= same state hash</text>
  <text x="36" y="198" class="mute">One sentence. Everything to the</text>
  <text x="36" y="214" class="mute">right is a consequence of it.</text>
  <rect class="panel" x="316" y="52" width="444" height="186" />
  <text x="332" y="80" class="label" font-size="12">replays that cost nothing</text>
  <text x="332" y="95" class="mute">you already stored the commands</text>
  <text x="332" y="114" class="label" font-size="12">lockstep multiplayer</text>
  <text x="332" y="129" class="mute">peers compute, they do not sync state</text>
  <text x="332" y="148" class="label" font-size="12">desync detection</text>
  <text x="332" y="163" class="mute">compare one number, not a world</text>
  <text x="332" y="182" class="label" font-size="12">a gradable engine</text>
  <text x="332" y="197" class="mute">the vector says what the hash must be</text>
  <text x="332" y="216" class="label" font-size="12">reproducible bug reports</text>
  <text x="332" y="231" class="mute">seed plus log reproduces it exactly</text>
  <path class="arrow" d="M 292 76 L 312 76" />
  <path class="arrow" d="M 292 110 L 312 110" />
  <path class="arrow" d="M 292 144 L 312 144" />
  <path class="arrow" d="M 292 178 L 312 178" />
  <path class="arrow" d="M 292 212 L 312 212" />
  <rect class="panel" x="20" y="252" width="740" height="44" />
  <text x="36" y="280" class="label">Lose the property and all five go at once — which is why it is the second thing this course teaches.</text>
</svg>
