<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.3; rx: 5; ry: 5; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.4; rx: 5; ry: 5; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.4; rx: 5; ry: 5; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .tl    { stroke: #9ca3af; stroke-width: 1.5; }
    .tick  { stroke: #fcd34d; stroke-width: 2; }
  </style>
  <rect class="bg" x="0" y="0" width="780" height="360" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">One hit, eight cheap effects — none of them change the damage number</text>

  <line x1="60" y1="80" x2="740" y2="80" class="tl" />
  <text x="60" y="70" class="mute">t=0 · impact</text>
  <text x="740" y="70" text-anchor="end" class="mute">t=400ms</text>

  <line x1="60" y1="72" x2="60" y2="88" class="tick" />
  <line x1="120" y1="72" x2="120" y2="88" class="tick" />
  <line x1="250" y1="72" x2="250" y2="88" class="tick" />
  <line x1="450" y1="72" x2="450" y2="88" class="tick" />

  <rect class="good" x="40" y="100" width="140" height="86" />
  <text x="110" y="122" text-anchor="middle" class="label">0–60ms</text>
  <text x="110" y="142" text-anchor="middle" class="body">hitstop (freeze)</text>
  <text x="110" y="159" text-anchor="middle" class="body">flash white</text>
  <text x="110" y="176" text-anchor="middle" class="body">sound</text>

  <rect class="node" x="200" y="100" width="140" height="86" />
  <text x="270" y="122" text-anchor="middle" class="label">60–200ms</text>
  <text x="270" y="142" text-anchor="middle" class="body">screen shake</text>
  <text x="270" y="159" text-anchor="middle" class="body">knockback</text>
  <text x="270" y="176" text-anchor="middle" class="body">particles</text>

  <rect class="node" x="360" y="100" width="140" height="86" />
  <text x="430" y="122" text-anchor="middle" class="label">200–400ms</text>
  <text x="430" y="142" text-anchor="middle" class="body">damage number</text>
  <text x="430" y="159" text-anchor="middle" class="body">floats and fades</text>
  <text x="430" y="176" text-anchor="middle" class="body">health bar lerps</text>

  <rect class="warn" x="530" y="100" width="212" height="86" />
  <text x="636" y="122" text-anchor="middle" class="label">The simulation</text>
  <text x="636" y="146" text-anchor="middle" class="body">hp -= 10</text>
  <text x="636" y="168" text-anchor="middle" class="mute">That is all it did.</text>

  <rect class="panel" x="20" y="204" width="740" height="140" />
  <text x="36" y="228" class="h">Feel lives in the renderer, never in the sim</text>
  <text x="36" y="254" class="body">Screen shake, hitstop, and squash are visual lies told on top of a deterministic simulation. Put</text>
  <text x="36" y="272" class="body">any of them inside <tspan class="code">tick()</tspan> and you have broken replay, multiplayer, and your conformance vectors at once.</text>
  <text x="36" y="302" class="label">Forgiveness mechanics are the exception — those ARE simulation:</text>
  <text x="36" y="324" class="body">coyote time (jump just after leaving the ledge) · input buffering (press jump just before landing)</text>
</svg>
