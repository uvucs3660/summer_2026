<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 292" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="292" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Desync detection is one number every thirty ticks</text>
  <rect class="panel" x="20" y="42" width="740" height="110" />
  <text x="36" y="68" class="h" font-size="12">peers exchange stateHash() every 30 ticks</text>
  <rect class="good" x="36" y="84" width="224" height="52" />
  <text x="148" y="106" class="label" text-anchor="middle" font-size="11">peer A</text>
  <text x="148" y="126" class="code" text-anchor="middle" font-size="12">0x7F21C4</text>
  <rect class="good" x="278" y="84" width="224" height="52" />
  <text x="390" y="106" class="label" text-anchor="middle" font-size="11">peer B</text>
  <text x="390" y="126" class="code" text-anchor="middle" font-size="12">0x7F21C4</text>
  <rect class="bad" x="520" y="84" width="224" height="52" />
  <text x="632" y="106" class="label" text-anchor="middle" font-size="11">peer C</text>
  <text x="632" y="126" class="code" text-anchor="middle" font-size="12">0x3A0918</text>
  <rect class="panel" x="20" y="166" width="360" height="100" />
  <text x="36" y="192" class="h" font-size="12">What it costs</text>
  <text x="36" y="216" class="body">4 bytes, twice a second.</text>
  <text x="36" y="236" class="body">The first mismatched tick is</text>
  <text x="36" y="256" class="body">where determinism broke.</text>
  <rect class="panel" x="400" y="166" width="360" height="100" />
  <text x="416" y="192" class="h" font-size="12">What to do</text>
  <rect class="bad" x="416" y="202" width="328" height="30" />
  <text x="580" y="222" class="label" text-anchor="middle" font-size="11">halt, and say so</text>
  <text x="416" y="248" class="mute">Two players confidently winning different</text>
  <text x="416" y="262" class="mute">games is worse than an honest error.</text>
</svg>
