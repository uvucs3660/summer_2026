<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="320" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Two languages. Two rendering stacks. One decomposition.</text>
  <rect class="panel" x="20" y="42" width="360" height="152" />
  <text x="36" y="68" class="h" font-size="12">Build 1 — Dart, Flutter GPU</text>
  <text x="36" y="92" class="mute">one prompt + six answered questions</text>
  <text x="36" y="116" class="code">~4,000 lines</text>
  <text x="36" y="144" class="body">Pathfinding, adaptive AI opponent,</text>
  <text x="36" y="164" class="body">four ages of units, deployed.</text>
  <rect class="panel" x="400" y="42" width="360" height="152" />
  <text x="416" y="68" class="h" font-size="12">Build 2 — TypeScript, three.js</text>
  <text x="416" y="92" class="mute">one prompt + six answered questions</text>
  <text x="416" y="116" class="code">~4,000 lines</text>
  <text x="416" y="144" class="body">Pathfinding, adaptive AI opponent,</text>
  <text x="416" y="164" class="body">four ages of units, deployed.</text>
  <path class="arrow" d="M 200 200 L 340 218" />
  <path class="arrow" d="M 580 200 L 440 218" />
  <rect class="panel" x="20" y="224" width="740" height="74" />
  <text x="36" y="250" class="h" font-size="12">They converged, independently, on the same four layers</text>
  <rect class="good" x="36" y="262" width="164" height="26" />
  <text x="118" y="280" class="label" text-anchor="middle" font-size="10">pure simulation</text>
  <rect class="good" x="218" y="262" width="164" height="26" />
  <text x="300" y="280" class="label" text-anchor="middle" font-size="10">renderer that reads it</text>
  <rect class="good" x="400" y="262" width="164" height="26" />
  <text x="482" y="280" class="label" text-anchor="middle" font-size="10">UI layer</text>
  <rect class="good" x="582" y="262" width="164" height="26" />
  <text x="664" y="280" class="label" text-anchor="middle" font-size="10">thin wiring</text>
  <text x="36" y="314" class="h" font-size="12">That convergence is evidence the boundary is real rather than stylistic.</text>
</svg>
