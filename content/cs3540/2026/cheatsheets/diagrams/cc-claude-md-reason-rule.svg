<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="300" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">A rule without a reason gets rationalised around</text>
  <rect class="panel" x="20" y="42" width="740" height="104" />
  <text x="36" y="66" class="h" font-size="13">Without the reason</text>
  <rect class="warn" x="36" y="78" width="300" height="30" />
  <text x="48" y="98" class="label" font-size="11">Do not use the cache layer directly.</text>
  <path class="warrow" d="M 348 93 L 388 93" />
  <rect class="bad" x="400" y="78" width="344" height="30" />
  <text x="412" y="98" class="label" font-size="11">“this case looks fine” — and past it goes</text>
  <text x="36" y="132" class="body">Nothing to check against, so the first inconvenient case wins. A new hire does the same thing.</text>
  <rect class="panel" x="20" y="158" width="740" height="104" />
  <text x="36" y="182" class="h" font-size="13">With the reason</text>
  <rect class="node" x="36" y="194" width="300" height="30" />
  <text x="48" y="208" class="body" font-size="10.5">Do not use the cache layer directly —</text>
  <text x="48" y="220" class="body" font-size="10.5">it does not invalidate on write.</text>
  <path class="arrow" d="M 348 209 L 388 209" />
  <rect class="good" x="400" y="194" width="344" height="30" />
  <text x="412" y="214" class="label" font-size="11">“does this path read after a write?”</text>
  <text x="36" y="248" class="body">Now there is a fact to reason with — and a real argument when the exception is genuine.</text>
  <text x="36" y="290" class="label">Reasons convert obedience into judgement, and cost you eight words.</text>
</svg>
