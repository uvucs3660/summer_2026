<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 288" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="288" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">near destroys depth precision for the whole scene</text>
  <rect class="panel" x="20" y="42" width="360" height="174" />
  <text x="36" y="68" class="h" font-size="12">near = 0.001 “just in case”</text>
  <rect class="bad" x="36" y="84" width="328" height="46" />
  <text x="200" y="104" class="body" text-anchor="middle" font-size="11">most of the depth buffer is spent</text>
  <text x="200" y="122" class="body" text-anchor="middle" font-size="11">on the first few centimetres</text>
  <text x="36" y="152" class="body" font-size="11">Precision is distributed non-linearly —</text>
  <text x="36" y="172" class="body" font-size="11">almost all of it sits near the near plane.</text>
  <rect class="bad" x="36" y="184" width="328" height="24" />
  <text x="200" y="201" class="label" text-anchor="middle" font-size="10">z-fighting everywhere, at every distance</text>
  <rect class="panel" x="400" y="42" width="360" height="174" />
  <text x="416" y="68" class="h" font-size="12">near = closest visible geometry</text>
  <rect class="good" x="416" y="84" width="328" height="46" />
  <text x="580" y="104" class="body" text-anchor="middle" font-size="11">the buffer covers the range</text>
  <text x="580" y="122" class="body" text-anchor="middle" font-size="11">you actually draw into</text>
  <text x="416" y="152" class="body" font-size="11">Push near out as far as your nearest</text>
  <text x="416" y="172" class="body" font-size="11">visible surface allows.</text>
  <rect class="good" x="416" y="184" width="328" height="24" />
  <text x="580" y="201" class="label" text-anchor="middle" font-size="10">precision where the scene actually is</text>
  <rect class="panel" x="20" y="230" width="740" height="44" />
  <text x="36" y="258" class="label">far barely matters. near is the whole game — the ratio far/near is what sets precision.</text>
</svg>
