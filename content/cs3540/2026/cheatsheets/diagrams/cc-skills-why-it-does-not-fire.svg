<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 352" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="352" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Selection reads descriptions. Nothing else.</text>
  <rect class="panel" x="20" y="42" width="300" height="220" />
  <text x="36" y="68" class="h" font-size="12">What is read when choosing</text>
  <rect class="good" x="36" y="82" width="268" height="28" />
  <text x="48" y="102" class="label" font-size="11">the description line</text>
  <rect class="node" x="36" y="118" width="268" height="26" />
  <text x="48" y="136" class="mute">the skill's body</text>
  <rect class="node" x="36" y="146" width="268" height="26" />
  <text x="48" y="164" class="mute">your file tree</text>
  <rect class="node" x="36" y="174" width="268" height="26" />
  <text x="48" y="192" class="mute">the code you wrote</text>
  <rect class="node" x="36" y="202" width="268" height="26" />
  <text x="48" y="220" class="mute">how good the skill is</text>
  <text x="36" y="240" class="mute">Only the green one. The rest are</text>
  <text x="36" y="256" class="mute">invisible at selection time.</text>
  <rect class="panel" x="340" y="42" width="420" height="220" />
  <text x="356" y="68" class="h" font-size="12">Two descriptions for one skill</text>
  <rect class="bad" x="356" y="82" width="388" height="52" />
  <text x="368" y="104" class="label" font-size="11">“Helps with PRs.”</text>
  <text x="368" y="124" class="body" font-size="11">matches nothing anybody actually types</text>
  <rect class="good" x="356" y="146" width="388" height="52" />
  <text x="368" y="168" class="body" font-size="11">“Use when the user asks to open a pull</text>
  <text x="368" y="188" class="body" font-size="11">request, review a diff, or says ship it.”</text>
  <text x="368" y="218" class="mute">names the phrases people really use, so</text>
  <text x="368" y="234" class="mute">there is something concrete to match</text>
  <rect class="panel" x="20" y="278" width="740" height="60" />
  <text x="36" y="304" class="label">Write the description first.</text>
  <text x="36" y="326" class="body">If you cannot state the trigger, you do not yet know what the skill is for — and neither will Claude.</text>
</svg>
