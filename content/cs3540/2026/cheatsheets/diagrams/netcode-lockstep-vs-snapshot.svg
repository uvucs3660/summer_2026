<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
  </style>

  <text x="20" y="26" class="h" font-size="15">Send commands, or send state — the choice decides everything else</text>

  <rect class="good" x="20" y="46" width="365" height="185" />
  <text x="36" y="70" class="label">LOCKSTEP — send commands</text>
  <text x="36" y="96"  class="code">{ tick: 42, kind: 'move', args: {...} }</text>
  <text x="36" y="122" class="body">tiny · scales to thousands of units</text>
  <text x="36" y="142" class="body">every peer simulates everything</text>
  <text x="36" y="162" class="body">requires PERFECT determinism</text>
  <text x="36" y="186" class="mute">Used by: RTS, fighting games</text>
  <text x="36" y="208" class="mute">Fails by: one divergent float, everyone desyncs</text>

  <rect class="node" x="400" y="46" width="360" height="185" />
  <text x="416" y="70" class="label">SNAPSHOT — send state</text>
  <text x="416" y="96"  class="code">{ tick: 42, entities: [ ...all of them ] }</text>
  <text x="416" y="122" class="body">large · scales with entity count</text>
  <text x="416" y="142" class="body">server is authoritative</text>
  <text x="416" y="162" class="body">tolerates imprecision</text>
  <text x="416" y="186" class="mute">Used by: shooters, MMOs</text>
  <text x="416" y="208" class="mute">Fails by: bandwidth, and needs a server you pay for</text>

  <rect class="warn" x="20" y="252" width="740" height="60" />
  <text x="36" y="276" class="label">This course is lockstep over peer-to-peer — so determinism is not a nicety</text>
  <text x="36" y="298" class="body">There is no authoritative server to correct anyone. One divergent quantization and every peer disagrees forever.</text>

  <rect class="panel" x="20" y="328" width="740" height="58" />
  <text x="36" y="352" class="h">The desync detector you already built</text>
  <text x="36" y="376" class="code">exchange stateHash() every N ticks — first mismatched tick is where determinism broke</text>
</svg>
