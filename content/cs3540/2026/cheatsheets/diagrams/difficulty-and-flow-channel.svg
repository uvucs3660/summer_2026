<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .axis  { stroke: #9ca3af; stroke-width: 1.5; }
    .channel { fill: #064e3b; opacity: 0.45; }
    .anx   { fill: #7c2d12; opacity: 0.35; }
    .bore  { fill: #1f2937; opacity: 0.7; }
    .saw   { stroke: #34d399; stroke-width: 2.5; fill: none; }
    .flat  { stroke: #fb923c; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
  </style>

  <text x="20" y="26" class="h" font-size="15">Skill rises whether you plan for it or not</text>

  <rect class="panel" x="20" y="42" width="740" height="230" />

  <polygon class="anx"  points="60,240 60,70 700,70 700,150" />
  <polygon class="channel" points="60,240 700,150 700,215 60,255" />
  <polygon class="bore" points="60,255 700,215 700,245 60,245" />

  <path d="M 60 235 L 140 200 L 140 225 L 230 185 L 230 210 L 330 165 L 330 195 L 440 150 L 440 180 L 560 135 L 560 168 L 700 125" class="saw" />
  <path d="M 60 220 L 700 220" class="flat" />

  <text x="330" y="100" class="label">ANXIETY</text>
  <text x="330" y="120" class="mute">demand outruns skill — the player quits</text>

  <text x="330" y="192" class="label">FLOW</text>

  <text x="200" y="268" class="label">BOREDOM</text>
  <text x="200" y="285" class="mute">a flat curve slides here on its own</text>

  <text x="620" y="112" class="mute">sawtooth: spike, then</text>
  <text x="620" y="127" class="mute">let them master it</text>

  <line x1="60" y1="240" x2="60" y2="60" class="axis" />
  <line x1="60" y1="240" x2="720" y2="240" class="axis" />
  <text x="40" y="60" text-anchor="end" class="mute">hard</text>
  <text x="40" y="238" text-anchor="end" class="mute">easy</text>
  <text x="390" y="262" text-anchor="middle" class="body">time played · skill rising</text>

  <rect class="panel" x="20" y="286" width="740" height="60" />
  <text x="36" y="310" class="body">The dashed line is constant difficulty. It does not stay level relative to the player — it falls, because</text>
  <text x="36" y="330" class="body">they keep getting better. Standing still is a decision to become boring.</text>
</svg>
