  <rect class="node" x="222" y="128" width="148" height="30" />
  <text x="232" y="148" class="label" font-size="11">S09</text>
  <text x="270" y="148" class="body" font-size="10">2D backend</text>
  <rect class="warn" x="222" y="164" width="148" height="30" />
  <text x="232" y="184" class="label" font-size="11">S10</text>
  <text x="270" y="184" class="body" font-size="10">3D · heavy</text>
  <rect class="panel" x="396" y="52" width="176" height="190" />
  <text x="410" y="78" class="h" font-size="12">World &amp; agents</text>
  <rect class="node" x="410" y="92" width="148" height="30" />
  <text x="420" y="112" class="label" font-size="11">S11</text>
  <text x="458" y="112" class="body" font-size="10">collision</text>
  <rect class="node" x="410" y="128" width="148" height="30" />
  <text x="420" y="148" class="label" font-size="11">S12</text>
  <text x="458" y="148" class="body" font-size="10">pathfinding</text>
  <rect class="warn" x="410" y="164" width="148" height="30" />
  <text x="420" y="184" class="label" font-size="11">S13</text>
  <text x="458" y="184" class="body" font-size="10">game AI · heavy</text>
  <rect class="node" x="410" y="200" width="148" height="30" />
  <text x="420" y="220" class="label" font-size="11">S14</text>
  <text x="458" y="220" class="body" font-size="10">procgen</text>
  <rect class="panel" x="584" y="52" width="176" height="190" />
  <text x="598" y="78" class="h" font-size="12">Content &amp; seams</text>
  <rect class="node" x="598" y="92" width="148" height="30" />
  <text x="608" y="112" class="label" font-size="11">S15</text>
  <text x="646" y="112" class="body" font-size="10">narrative</text>
  <rect class="node" x="598" y="128" width="148" height="30" />
  <text x="608" y="148" class="label" font-size="11">S16</text>
  <text x="646" y="148" class="body" font-size="10">generator</text>
  <rect class="warn" x="598" y="164" width="148" height="30" />
  <text x="608" y="184" class="label" font-size="11">S17</text>
  <text x="646" y="184" class="body" font-size="10">transport · heavy</text>
  <rect class="node" x="598" y="200" width="148" height="30" />
  <text x="608" y="220" class="label" font-size="11">S18</text>
  <text x="646" y="220" class="body" font-size="10">audio</text>
  <path class="arrow" d="M 390 250 L 390 268" />
  <rect class="panel" x="20" y="272" width="740" height="54" />
  <text x="36" y="296" class="label" font-size="12">S00 overview · S01 time and loop · S02 determinism · S03 command model</text>
  <text x="36" y="316" class="mute">instructor-owned, stable before you start — every section above is written against it</text>
