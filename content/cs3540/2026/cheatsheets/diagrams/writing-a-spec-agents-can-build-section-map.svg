  <rect class="node" x="34" y="128" width="148" height="30" />
  <text x="44" y="148" class="label" font-size="11">S05</text>
  <text x="82" y="148" class="body" font-size="10">entity store</text>
  <rect class="node" x="34" y="164" width="148" height="30" />
  <text x="44" y="184" class="label" font-size="11">S06</text>
  <text x="82" y="184" class="body" font-size="10">event bus</text>
