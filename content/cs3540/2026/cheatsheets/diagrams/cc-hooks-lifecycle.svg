<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.3; rx: 6; ry: 6; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 6; ry: 6; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 6; ry: 6; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="380" fill="#0b1220" rx="12" ry="12" />

  <text x="20" y="26" class="h" font-size="15">Exit 0 allows. Exit 2 cancels the tool call and tells Claude why.</text>

  <rect class="node" x="20" y="52" width="118" height="42" /><text x="79" y="78" text-anchor="middle" class="body">SessionStart</text>
  <rect class="node" x="152" y="52" width="130" height="42" /><text x="217" y="78" text-anchor="middle" class="body">UserPromptSubmit</text>
  <rect class="good" x="296" y="52" width="118" height="42" /><text x="355" y="78" text-anchor="middle" class="label">PreToolUse</text>
  <rect class="node" x="428" y="52" width="100" height="42" /><text x="478" y="78" text-anchor="middle" class="body">tool runs</text>
  <rect class="good" x="542" y="52" width="118" height="42" /><text x="601" y="78" text-anchor="middle" class="label">PostToolUse</text>
  <rect class="node" x="674" y="52" width="86" height="42" /><text x="717" y="78" text-anchor="middle" class="body">Stop</text>

  <path d="M 142 73 L 148 73" class="arrow" />
  <path d="M 286 73 L 292 73" class="arrow" />
  <path d="M 418 73 L 424 73" class="arrow" />
  <path d="M 532 73 L 538 73" class="arrow" />
  <path d="M 664 73 L 670 73" class="arrow" />

  <text x="355" y="112" text-anchor="middle" class="mute">the two that take a matcher</text>
  <text x="601" y="112" text-anchor="middle" class="mute">(a regex over tool names)</text>

  <rect class="panel" x="20" y="132" width="365" height="150" />
  <text x="36" y="156" class="h">The contract</text>
  <text x="36" y="182" class="body">Event JSON arrives on <tspan class="code">stdin</tspan>. Parse with jq.</text>
  <text x="36" y="208" class="body"><tspan class="label">exit 0</tspan> — allow. stdout can become context.</text>
  <text x="36" y="234" class="body"><tspan class="label">exit 2</tspan> — BLOCK. The call is cancelled and</text>
  <text x="36" y="252" class="body">your stderr is shown to Claude as the reason.</text>
  <text x="36" y="274" class="mute">So write a stderr message that explains the fix.</text>

  <rect class="warn" x="400" y="132" width="360" height="150" />
  <text x="416" y="156" class="label">Declined vs. blocked</text>
  <text x="416" y="182" class="body">A soul makes the agent <tspan class="label">want</tspan> to behave.</text>
  <text x="416" y="200" class="mute">Probabilistic. Persuadable in principle.</text>
  <text x="416" y="228" class="body">A hook makes misbehavior <tspan class="label">impossible</tspan>.</text>
  <text x="416" y="246" class="mute">Deterministic. Cannot be sweet-talked.</text>
  <text x="416" y="274" class="mute">If it must happen, hook it.</text>

  <rect class="panel" x="20" y="296" width="740" height="66" />
  <text x="36" y="320" class="h">A hook you have not watched fire is not done</text>
  <text x="36" y="346" class="body">Echo a crafted event into the script by hand and check the exit code. Test the BLOCKING case first.</text>
</svg>
