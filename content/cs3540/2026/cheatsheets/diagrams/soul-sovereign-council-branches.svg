<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; font-size: 12px; }
    .body  { fill: #d1d5db; font-size: 11px; }
    .mute  { fill: #9ca3af; font-size: 10px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#tri); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af" />
    </marker>
  </defs>

  <text x="20" y="26" class="h" font-size="15">Document, engine, actors — three layers of one system</text>

  <rect class="good" x="20" y="46" width="230" height="110" />
  <text x="135" y="70" text-anchor="middle" class="label">SOUL</text>
  <text x="135" y="92" text-anchor="middle" class="body">the constitution</text>
  <text x="135" y="114" text-anchor="middle" class="mute">a versioned markdown</text>
  <text x="135" y="130" text-anchor="middle" class="mute">document that sets the rules</text>

  <rect class="node" x="275" y="46" width="230" height="110" />
  <text x="390" y="70" text-anchor="middle" class="label">SOVEREIGN</text>
  <text x="390" y="92" text-anchor="middle" class="body">the engine</text>
  <text x="390" y="114" text-anchor="middle" class="mute">three branches, and an</text>
  <text x="390" y="130" text-anchor="middle" class="mute">unamendable human above them</text>

  <rect class="node" x="530" y="46" width="230" height="110" />
  <text x="645" y="70" text-anchor="middle" class="label">COUNCIL</text>
  <text x="645" y="92" text-anchor="middle" class="body">the actors</text>
  <text x="645" y="114" text-anchor="middle" class="mute">five seats — one human,</text>
  <text x="645" y="130" text-anchor="middle" class="mute">four AIs — who deliberate</text>

  <path d="M 254 101 L 271 101" class="arrow" />
  <path d="M 509 101 L 526 101" class="arrow" />
  <text x="262" y="90" text-anchor="middle" class="mute">governs</text>
  <text x="517" y="90" text-anchor="middle" class="mute">staffs</text>

  <rect class="panel" x="20" y="176" width="740" height="110" />
  <text x="36" y="200" class="h">Deliberation norms</text>
  <text x="36" y="226" class="body"><tspan class="label">Fresh perspective</tspan> — no session history carries over; no member is bound by past votes.</text>
  <text x="36" y="248" class="body"><tspan class="label">Good faith</tspan> — collaborative pursuit of a better answer, not adversarial debate.</text>
  <text x="36" y="270" class="body"><tspan class="label">Equal consideration</tspan> — the strength of an argument decides, not the identity of its source.</text>

  <rect class="warn" x="20" y="302" width="740" height="84" />
  <text x="36" y="326" class="label">Equality applies to deliberation. Authority does not transfer.</text>
  <text x="36" y="350" class="body">The human's vote weighs the same as each AI's — and the human override sits outside the tally entirely.</text>
  <text x="36" y="372" class="mute">Dissent is preserved in full: today's minority opinion may become tomorrow's governing principle.</text>
</svg>
