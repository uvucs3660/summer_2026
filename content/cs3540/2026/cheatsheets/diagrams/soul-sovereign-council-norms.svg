<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 326" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="326" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Equal consideration in deliberation. Authority does not transfer.</text>
  <rect class="panel" x="20" y="42" width="740" height="42" />
  <text x="36" y="70" class="label">The strength of an argument decides — not the identity of whoever made it.</text>
  <rect class="panel" x="20" y="96" width="360" height="170" />
  <text x="36" y="122" class="h" font-size="12">Council norms</text>
  <rect class="good" x="36" y="138" width="328" height="38" />
  <text x="48" y="154" class="label" font-size="11">fresh perspective</text>
  <text x="48" y="169" class="mute">no deference to the last round</text>
  <rect class="good" x="36" y="180" width="328" height="38" />
  <text x="48" y="196" class="label" font-size="11">good faith</text>
  <text x="48" y="211" class="mute">steelman before you object</text>
  <rect class="good" x="36" y="222" width="328" height="38" />
  <text x="48" y="238" class="label" font-size="11">equal consideration</text>
  <text x="48" y="253" class="mute">arguments, not sources</text>
  <rect class="panel" x="400" y="96" width="360" height="170" />
  <text x="416" y="122" class="h" font-size="12">What equality is not</text>
  <rect class="bad" x="416" y="138" width="328" height="52" />
  <text x="428" y="158" class="body" font-size="11">“the Council agreed, so it is</text>
  <text x="428" y="178" class="body" font-size="11">authorised”</text>
  <text x="416" y="214" class="body">Equality applies to deliberation.</text>
  <text x="416" y="232" class="body">Authority stays with the</text>
  <text x="416" y="250" class="body">unamendable human above them.</text>
  <rect class="panel" x="20" y="280" width="740" height="34" />
  <text x="36" y="302" class="label" font-size="11">The unit of governance is a ratified Skill. Nothing enters without a vote.</text>
</svg>
