<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="300" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">Same numbers, different picture</text>
  <rect class="panel" x="20" y="42" width="360" height="190" />
  <text x="36" y="68" class="h" font-size="12">Translate x Rotate x Scale</text>
  <text x="36" y="92" class="mute">applied right to left</text>
  <rect class="good" x="36" y="106" width="328" height="76" />
  <circle cx="120" cy="144" r="9" fill="#34d399" />
  <path class="arrow" d="M 120 122 A 26 26 0 1 1 106 132" />
  <text x="250" y="138" class="body" text-anchor="middle" font-size="11">scaled, then spun</text>
  <text x="250" y="158" class="body" text-anchor="middle" font-size="11">about its own origin</text>
  <text x="36" y="208" class="body" font-size="11">The object spins in place.</text>
  <rect class="panel" x="400" y="42" width="360" height="190" />
  <text x="416" y="68" class="h" font-size="12">Rotate x Translate x Scale</text>
  <text x="416" y="92" class="mute">the two swapped</text>
  <rect class="bad" x="416" y="106" width="328" height="76" />
  <circle cx="460" cy="168" r="5" fill="#9ca3af" />
  <text x="470" y="172" class="mute">origin</text>
  <circle cx="600" cy="130" r="9" fill="#f87171" />
  <path class="arrow" d="M 470 162 A 90 90 0 0 1 592 126" />
  <text x="660" y="150" class="body" text-anchor="middle" font-size="11">swept around</text>
  <text x="416" y="208" class="body" font-size="11">The object orbits the origin.</text>
  <rect class="panel" x="20" y="246" width="740" height="40" />
  <text x="36" y="272" class="label">An unpinned choice two builds will differ on. Write the order into your section.</text>
</svg>
