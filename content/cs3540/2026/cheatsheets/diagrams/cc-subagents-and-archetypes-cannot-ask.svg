<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <style>
    .panel { fill: #0b1220; stroke: #374151; stroke-width: 1.2; rx: 10; ry: 10; }
    .node  { fill: #1f2937; stroke: #60a5fa; stroke-width: 1.4; rx: 8; ry: 8; }
    .good  { fill: #064e3b; stroke: #34d399; stroke-width: 1.5; rx: 8; ry: 8; }
    .warn  { fill: #7c2d12; stroke: #fb923c; stroke-width: 1.5; rx: 8; ry: 8; }
    .bad   { fill: #7f1d1d; stroke: #f87171; stroke-width: 1.5; rx: 8; ry: 8; }
    .h     { fill: #fcd34d; font-weight: 700; }
    .label { fill: #f9fafb; font-weight: 700; }
    .body  { fill: #d1d5db; font-size: 12px; }
    .mute  { fill: #9ca3af; font-size: 11px; }
    .code  { font-family: ui-monospace, Menlo, monospace; fill: #93c5fd; font-size: 11px; }
    .arrow { stroke: #9ca3af; stroke-width: 1.6; fill: none; marker-end: url(#tri); }
    .warrow{ stroke: #fb923c; stroke-width: 1.8; fill: none; marker-end: url(#tri-w); }
  </style>
  <defs>
    <marker id="tri" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af" />
    </marker>
    <marker id="tri-w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="780" height="330" fill="#0b1220" rx="12" ry="12" />
  <text x="20" y="24" class="h" font-size="15">It runs once, alone, and returns</text>
  <rect class="panel" x="20" y="42" width="360" height="200" />
  <text x="36" y="68" class="h" font-size="13">Leaves it guessing</text>
  <rect class="bad" x="36" y="82" width="328" height="34" />
  <text x="48" y="104" class="label" font-size="11">“Look into the collision code.”</text>
  <text x="36" y="140" class="body" font-size="11">Three questions it cannot ask you:</text>
  <rect class="warn" x="36" y="152" width="328" height="24" />
  <text x="48" y="168" class="body" font-size="10">how much of it?</text>
  <rect class="warn" x="36" y="180" width="328" height="24" />
  <text x="48" y="196" class="body" font-size="10">in what output shape?</text>
  <rect class="warn" x="36" y="208" width="328" height="24" />
  <text x="48" y="224" class="body" font-size="10">am I allowed to edit?</text>
  <rect class="panel" x="400" y="42" width="360" height="200" />
  <text x="416" y="68" class="h" font-size="13">Answers them in advance</text>
  <rect class="good" x="416" y="82" width="328" height="130" />
  <text x="428" y="104" class="body" font-size="10.5">Read src/sim/collision/ and report,</text>
  <text x="428" y="122" class="body" font-size="10.5">as a markdown table: every exported</text>
  <text x="428" y="140" class="body" font-size="10.5">function, its file:line, and whether it</text>
  <text x="428" y="158" class="body" font-size="10.5">is called from outside that directory.</text>
  <text x="428" y="182" class="label" font-size="10.5">Do not modify anything.</text>
  <text x="416" y="232" class="mute">scope · output shape · boundary</text>
  <rect class="panel" x="20" y="258" width="740" height="56" />
  <text x="36" y="284" class="label">A subagent cannot ask a clarifying question.</text>
  <text x="36" y="306" class="body" font-size="11">If you would have to answer something for a human doing this task, answer it before you send them.</text>
</svg>
